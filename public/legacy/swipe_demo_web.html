<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>

    window.__legacyMode = legacyParams.get('mode') === 'full' ? 'full' : 'lite';
    window.__legacyAutoEnter = legacyParams.get('autoEnter') === '1';

  <title>手拂过面部检测 - Web演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 17px; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      position: relative;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    /* ======================== 国风背景层 ======================== */

    /* 1. 主页背景：纯静态图 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('main_poster_3d.png') center center / cover no-repeat, #1a0303;
      z-index: -3;
    }

    /* 2. 金黄装饰层 - 已禁用 */
    body::after { display: none; }

    /* 3. 水波纹特效 - 已禁用 */
    .ripple-layer, .ripple { display: none !important; }

    /* 4. 流动脸谱效果 */
    .cloud-layer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.92;
      mix-blend-mode: screen;
    }

    .cloud-layer::before,
    .cloud-layer::after {
      content: '';
      position: absolute;
      inset: 0;
    }

    .cloud-layer::before {
      background:
        radial-gradient(circle at 16% 26%, rgba(72, 204, 255, 0.16), transparent 18%),
        radial-gradient(circle at 74% 24%, rgba(255, 217, 128, 0.12), transparent 16%),
        radial-gradient(circle at 82% 76%, rgba(205, 34, 51, 0.16), transparent 22%);
    }

    .cloud-layer::after {
      background:
        repeating-linear-gradient(
          90deg,
          rgba(127, 229, 255, 0.022) 0,
          rgba(127, 229, 255, 0.022) 1px,
          transparent 1px,
          transparent 92px
        ),
        repeating-linear-gradient(
          180deg,
          rgba(127, 229, 255, 0.012) 0,
          rgba(127, 229, 255, 0.012) 1px,
          transparent 1px,
          transparent 74px
        );
      opacity: 0.48;
    }

    .signal-sweep,
    .beam-haze,
    .hud-orbit,
    .data-stream,
    .signal-cluster {
      position: absolute;
    }

    .signal-sweep {
      inset: -12% auto auto -18%;
      width: 54%;
      height: 170%;
      background: linear-gradient(
        114deg,
        transparent 18%,
        rgba(127, 229, 255, 0.06) 42%,
        rgba(255, 215, 120, 0.12) 50%,
        transparent 64%
      );
      transform: rotate(8deg);
      animation: sweepAcross 13s ease-in-out infinite;
    }

    .beam-haze {
      border-radius: 50%;
      filter: blur(34px);
      opacity: 0.34;
      animation: hazePulse 12s ease-in-out infinite;
    }

    .beam-a {
      left: -8%;
      top: 10%;
      width: 34vw;
      height: 34vw;
      min-width: 220px;
      min-height: 220px;
      background: rgba(72, 204, 255, 0.18);
    }

    .beam-b {
      right: -10%;
      bottom: -8%;
      width: 32vw;
      height: 32vw;
      min-width: 220px;
      min-height: 220px;
      background: rgba(205, 34, 51, 0.16);
      animation-delay: -5s;
    }

    .beam-c {
      right: 12%;
      top: 18%;
      width: 22vw;
      height: 22vw;
      min-width: 180px;
      min-height: 180px;
      background: rgba(255, 217, 128, 0.14);
      animation-delay: -8s;
    }

    .hud-orbit {
      border-radius: 50%;
      border: 1px solid rgba(127, 229, 255, 0.22);
      box-shadow:
        inset 0 0 34px rgba(127, 229, 255, 0.08),
        0 0 30px rgba(127, 229, 255, 0.08);
      animation: orbitPulse 10s ease-in-out infinite;
    }

    .hud-orbit::before,
    .hud-orbit::after {
      content: '';
      position: absolute;
      border-radius: 50%;
    }

    .hud-orbit::before {
      inset: 14%;
      border: 1px dashed rgba(127, 229, 255, 0.24);
      animation: orbitSpin 18s linear infinite;
    }

    .hud-orbit::after {
      inset: 28%;
      border: 1px solid rgba(255, 215, 120, 0.2);
      animation: orbitSpin 12s linear infinite reverse;
    }

    .orbit-left {
      left: -110px;
      top: 18%;
      width: 380px;
      height: 380px;
    }

    .orbit-right {
      right: 4%;
      bottom: 8%;
      width: 280px;
      height: 280px;
      animation-delay: -3s;
    }

    .data-stream {
      top: -18%;
      width: 2px;
      height: 140%;
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(127, 229, 255, 0.06) 14%,
        rgba(127, 229, 255, 0.72) 48%,
        transparent 100%
      );
      box-shadow: 0 0 18px rgba(127, 229, 255, 0.3);
      animation: streamFall 12s linear infinite;
    }

    .data-stream::after {
      content: '';
      position: absolute;
      left: 50%;
      top: -4%;
      width: 10px;
      height: 42px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(127, 229, 255, 0));
      animation: nodeFall 4s linear infinite;
    }

    .stream-a {
      left: 14%;
      animation-duration: 10s;
    }

    .stream-a::after {
      animation-delay: -1.4s;
    }

    .stream-b {
      left: 32%;
      animation-duration: 13s;
      animation-delay: -4s;
    }

    .stream-b::after {
      animation-delay: -2.1s;
    }

    .stream-c {
      right: 24%;
      animation-duration: 11s;
      animation-delay: -6s;
    }

    .stream-c::after {
      animation-delay: -0.8s;
    }

    .stream-d {
      right: 10%;
      animation-duration: 15s;
      animation-delay: -9s;
    }

    .stream-d::after {
      animation-delay: -3s;
    }

    .signal-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid rgba(127, 229, 255, 0.12);
      border-radius: 999px;
      background: rgba(5, 10, 18, 0.22);
      backdrop-filter: blur(6px);
      animation: clusterDrift 18s ease-in-out infinite;
    }

    .signal-cluster span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(127, 229, 255, 0.94);
      box-shadow: 0 0 12px rgba(127, 229, 255, 0.7);
      animation: nodePulse 2.4s ease-in-out infinite;
    }

    .signal-cluster span:nth-child(2) {
      animation-delay: 0.18s;
    }

    .signal-cluster span:nth-child(3) {
      animation-delay: 0.36s;
    }

    .signal-cluster span:nth-child(4) {
      animation-delay: 0.54s;
    }

    .cluster-left {
      left: 10%;
      bottom: 16%;
    }

    .cluster-right {
      right: 10%;
      top: 18%;
      animation-delay: -6s;
    }

    @keyframes sweepAcross {
      0%,
      100% {
        transform: translateX(-4%) rotate(8deg);
        opacity: 0.12;
      }
      50% {
        transform: translateX(94%) rotate(8deg);
        opacity: 0.36;
      }
    }

    @keyframes hazePulse {
      0%,
      100% {
        transform: scale(0.94);
        opacity: 0.24;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.42;
      }
    }

    @keyframes orbitPulse {
      0%,
      100% {
        opacity: 0.42;
      }
      50% {
        opacity: 0.78;
      }
    }

    @keyframes orbitSpin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes streamFall {
      from {
        transform: translateY(-8%);
      }
      to {
        transform: translateY(14%);
      }
    }

    @keyframes nodeFall {
      from {
        transform: translate(-50%, 0);
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      to {
        transform: translate(-50%, 520px);
        opacity: 0;
      }
    }

    @keyframes clusterDrift {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-14px);
      }
    }

    @keyframes nodePulse {
      0%,
      100% {
        opacity: 0.36;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    body.is-lite .cloud-layer {
      display: none !important;
    }

    body.is-lite .mask-decoration,
    body.is-lite .video-container::before,
    body.is-lite .video-container::after {
      display: none !important;
    }

    /* 4. 鎏金细边 - 流动光影 */
    .chinese-border {
      position: relative;
      /* 用 padding 为描边留出 2px 缝隙 */
      padding: 2px !important;
      background:
        linear-gradient(white, white) padding-box,
        linear-gradient(
          120deg,
          #8b6914 0%,
          #d4af37 12%,
          #fff4c2 22%,
          #ffd700 30%,
          #b8860b 45%,
          #d4af37 60%,
          #fff8dc 72%,
          #ffd700 82%,
          #8b6914 100%
        ) border-box;
      background-size: 100% 100%, 300% 100%;
      background-repeat: no-repeat;
      border: 2px solid transparent;
      border-radius: 22px;
      box-shadow:
        0 0 0 1px rgba(139, 105, 20, 0.35),
        0 0 18px rgba(255, 215, 0, 0.35),
        0 20px 60px rgba(0, 0, 0, 0.3),
        inset 0 0 0 1px rgba(255, 248, 220, 0.5);
      animation: goldFlow 6s linear infinite;
    }

    @keyframes goldFlow {
      0%   { background-position: 0% 0%, 0%   50%; }
      100% { background-position: 0% 0%, 300% 50%; }
    }

    /* 鎏金高光扫过 */
    .chinese-border::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 22px;
      padding: 2px;
      background: linear-gradient(
        115deg,
        transparent 0%,
        transparent 38%,
        rgba(255, 255, 255, 0.85) 48%,
        rgba(255, 248, 220, 0.95) 50%,
        rgba(255, 255, 255, 0.85) 52%,
        transparent 62%,
        transparent 100%
      );
      background-size: 250% 100%;
      background-repeat: no-repeat;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      pointer-events: none;
      animation: goldShimmer 4.5s ease-in-out infinite;
    }

    @keyframes goldShimmer {
      0%        { background-position: -60% 0; opacity: 0.0; }
      15%       { opacity: 1; }
      50%       { background-position: 160% 0; opacity: 1; }
      65%       { opacity: 0.0; }
      100%      { background-position: 160% 0; opacity: 0.0; }
    }

    /* 5. 标题金色装饰 */
    .chinese-title {
      position: relative;
      display: inline-block;
    }

    .chinese-title::before,
    .chinese-title::after {
      content: '◆';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(212, 175, 55, 0.8);
      font-size: 16px;
      animation: diamondPulse 2s ease-in-out infinite;
    }

    .chinese-title::before {
      left: -25px;
    }

    .chinese-title::after {
      right: -25px;
    }

    @keyframes diamondPulse {
      0%, 100% { opacity: 0.5; transform: translateY(-50%) scale(1); }
      50% { opacity: 1; transform: translateY(-50%) scale(1.2); }
    }

    /* ======================== 原有样式 ======================== */

    .video-container {
      position: relative;
      border-radius: 12px;
      overflow: visible;
      box-shadow:
        0 0 0 8px rgba(139, 0, 0, 0.6),
        0 0 0 12px rgba(218, 165, 32, 0.8),

      top: -30px;

        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M10 10 L30 10 L30 30" stroke="%23DAA520" stroke-width="3" fill="none"/><path d="M70 10 L90 10 L90 30" stroke="%23DAA520" stroke-width="3" fill="none"/><path d="M10 70 L10 90 L30 90" stroke="%23DAA520" stroke-width="3" fill="none"/><path d="M70 90 L90 90 L90 70" stroke="%23DAA520" stroke-width="3" fill="none"/></svg>') no-repeat,

      top: -20px;

      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40"><path d="M20 20 Q40 10 60 20 T100 20 T140 20 T180 20" stroke="%23DAA520" stroke-width="2" fill="none" opacity="0.8"/><path d="M30 25 Q50 15 70 25 T110 25 T150 25 T190 25" stroke="%238B0000" stroke-width="1.5" fill="none" opacity="0.6"/><circle cx="100" cy="20" r="8" fill="%23DAA520" opacity="0.9"/><path d="M95 20 L100 15 L105 20 L100 25 Z" fill="%238B0000"/></svg>') no-repeat center;
      background-size: contain;

    }

    .video-inner {

      border-radius: 8px;

    }
    .mask-decoration {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 100px;
      height: 140px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.7;

      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));

      background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150"><defs><linearGradient id="maskGrad1" x1="0%25" y1="0%25" x2="0%25" y2="100%25"><stop offset="0%25" style="stop-color:%238B0000;stop-opacity:1" /><stop offset="50%25" style="stop-color:%23DAA520;stop-opacity:1" /><stop offset="100%25" style="stop-color:%238B0000;stop-opacity:1" /></linearGradient></defs><path d="M50 10 Q30 30 35 50 Q40 70 30 90 Q25 110 40 130 L60 130 Q75 110 70 90 Q60 70 65 50 Q70 30 50 10 Z" fill="url(%23maskGrad1)" opacity="0.9"/><ellipse cx="40" cy="45" rx="8" ry="12" fill="%23FFD700"/><ellipse cx="60" cy="45" rx="8" ry="12" fill="%23FFD700"/><path d="M35 70 Q50 80 65 70" stroke="%23FFD700" stroke-width="3" fill="none"/><circle cx="35" cy="30" r="4" fill="%23FFD700" opacity="0.8"/><circle cx="65" cy="30" r="4" fill="%23FFD700" opacity="0.8"/><path d="M20 20 Q10 40 15 60" stroke="%23DAA520" stroke-width="2" fill="none" opacity="0.7"/><path d="M80 20 Q90 40 85 60" stroke="%23DAA520" stroke-width="2" fill="none" opacity="0.7"/></svg>');

  <script>
  (() => {
    const button = document.getElementById('immersiveBtn');
    const buttonLabel = button?.querySelector('[data-immersive-button-label]');
    const panel = document.getElementById('immersiveScenePanel');
    const panelClose = document.getElementById('immersivePanelClose');
    const panelStatus = document.getElementById('immersivePanelStatus');
    const disableButton = document.getElementById('immersiveDisableBtn');
    const sceneButtons = Array.from(document.querySelectorAll('[data-immersive-scene]'));
    if (!button || !buttonLabel || !panel || !sceneButtons.length) return;

    window.__aiOperaImmersiveBootstrap = true;
    let modulePromise = null;

    function setPanelOpen(open) {
      panel.classList.toggle('is-visible', open);
      panel.setAttribute('aria-hidden', String(!open));
      button.setAttribute('aria-expanded', String(open));
      if (open) {
        sceneButtons[0]?.focus({ preventScroll: true });
        panel.scrollIntoView({ behavior: 'auto', block: 'nearest' });
      } else {
        button.focus({ preventScroll: true });
      }
    }

    async function loadImmersiveModule() {
      if (window.aiOperaImmersiveBackground) return window.aiOperaImmersiveBackground;
      if (!modulePromise) {
        modulePromise = import('/legacy/immersive-background.bundle.js?v=20260718-lazy')
          .then(() => window.aiOperaImmersiveBackground)
          .catch((error) => {
            modulePromise = null;
            throw error;
          });
      }
      const api = await modulePromise;
      if (!api) throw new Error('沉浸场景模块尚未就绪');
      return api;
    }

    button.addEventListener('click', () => {
      setPanelOpen(!panel.classList.contains('is-visible'));
    });
    panelClose?.addEventListener('click', () => setPanelOpen(false));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && panel.classList.contains('is-visible')) setPanelOpen(false);
    });

    sceneButtons.forEach((sceneButton) => {
      sceneButton.addEventListener('click', async () => {
        const sceneId = sceneButton.dataset.immersiveScene;
        if (!sceneId) return;
        const sceneLabel = sceneButton.querySelector('strong')?.textContent?.trim() || '场景';
        sceneButtons.forEach((item) => item.disabled = true);
        button.classList.add('is-loading');
        buttonLabel.textContent = '准备' + sceneLabel;
        if (panelStatus) panelStatus.textContent = '正在准备三维场景，首次加载请稍候…';
        try {
          const api = await loadImmersiveModule();
          await api.activate(sceneId);
        } catch (error) {
          console.error('[immersive-bootstrap] Scene load failed:', error);
          button.classList.remove('is-loading');
          buttonLabel.textContent = '身临其境';
          if (panelStatus) panelStatus.textContent = '场景暂时无法载入，请稍后重试。';
        } finally {
          sceneButtons.forEach((item) => item.disabled = false);
        }
      });
    });

    disableButton?.addEventListener('click', async () => {
      if (window.aiOperaImmersiveBackground) {
        await window.aiOperaImmersiveBackground.deactivate();
      } else {
        setPanelOpen(false);
      }
    });
  })();
  </script>

  <script>
    (function(){
      const steps = [
        '已采集多角度人脸帧',
        '已完成清晰度与姿态覆盖筛选',
        '多视角个人脸型拟合中',
        '脸谱 UV 锚点展开中',
        '三维脸谱贴图生成中',
        '法线与材质烘焙中',
        '三维脸谱面罩导出完成',
        '已加入脸谱陈列馆',
      ];
      const defaultSteps = steps.slice();
      const button = document.getElementById('hiFiMaskBtn');
      const panel = document.getElementById('hiFiMaskPanel');
      const list = document.getElementById('hiFiMaskSteps');
      const progressFill = document.getElementById('hiFiMaskProgressFill');
      const complete = document.getElementById('hiFiMaskComplete');
      const completeText = document.getElementById('hiFiMaskCompleteText');
      const viewButton = document.getElementById('hiFiMaskViewBtn');
      const badge = document.getElementById('hiFiMaskBadge');
      const progressStops = [0, 9, 23, 41, 56, 75, 88, 96, 100];

      if (!button || !panel || !list || !progressFill || !complete || !completeText || !viewButton || !badge) return;

      steps.forEach((label, index) => {
        const item = document.createElement('li');
        item.className = 'hifi-mask-step';
        item.dataset.stepIndex = String(index);

        const mark = document.createElement('span');
        mark.className = 'hifi-mask-step-mark';
        mark.textContent = String(index + 1);

        const text = document.createElement('span');
        text.className = 'hifi-mask-step-text';
        text.textContent = label;

        item.appendChild(mark);
        item.appendChild(text);
        list.appendChild(item);
      });

      function syncStepLabels() {
        const items = list.querySelectorAll('.hifi-mask-step');
        items.forEach((item, index) => {
          const text = item.querySelector('.hifi-mask-step-text');
          if (text) text.textContent = steps[index];
        });
      }

      function resetStepLabels() {
        defaultSteps.forEach((label, index) => {
          steps[index] = label;
        });
        syncStepLabels();
      }

      function renderStep(activeIndex) {
        const items = list.querySelectorAll('.hifi-mask-step');
        items.forEach((item, index) => {
          const mark = item.querySelector('.hifi-mask-step-mark');
          item.classList.toggle('is-done', index < activeIndex);
          item.classList.toggle('is-active', index === activeIndex);
          if (mark) {
            mark.textContent = index < activeIndex ? '✓' : String(index + 1);
          }
        });

        const progress = progressStops[Math.max(0, Math.min(progressStops.length - 1, activeIndex))] ?? 0;
        progressFill.style.width = `${progress}%`;
        badge.textContent = activeIndex >= steps.length ? '生成完成' : `流程 ${activeIndex + 1}/${steps.length}`;
      }

      function finishRun(message) {
        const items = list.querySelectorAll('.hifi-mask-step');
        items.forEach((item) => {
          item.classList.add('is-done');
          item.classList.remove('is-active');
          const mark = item.querySelector('.hifi-mask-step-mark');
          if (mark) mark.textContent = '✓';
        });
        progressFill.style.width = '100%';
        badge.textContent = '生成完成';
        completeText.textContent = message || '生成完成';
        complete.classList.add('is-visible');
        button.disabled = false;
        button.textContent = '生成个人专属三维脸谱面罩';
      }

      viewButton.addEventListener('click', () => {
        if (typeof window.__openPersonalModelViewer === 'function') {
          window.__openPersonalModelViewer();
          return;
        }
        const fallbackHref = new URL('/personal_model_viewer.html', window.location.origin);
        fallbackHref.searchParams.set('mode', window.__legacyMode || 'lite');
        window.top.location.href = fallbackHref.href;
      });

      window.__hqMaskStatusPanel = {
        update(event = {}) {
          if (event.type === 'start') {
            resetStepLabels();
            panel.classList.add('is-visible');
            complete.classList.remove('is-visible');
            completeText.textContent = '生成完成';
            button.disabled = true;
            button.textContent = '生成中...';
            renderStep(0);
            return;
          }

          if (event.type === 'step') {
            if (typeof event.index === 'number' && event.label) {
              steps[event.index] = event.label;
              syncStepLabels();
              renderStep(event.index);
            }
            return;
          }

          if (event.type === 'message') {
            if (event.message) {
              badge.textContent = event.message;
            }
            return;
          }

          if (event.type === 'busy') {
            panel.classList.add('is-visible');
            badge.textContent = event.message || '当前生成任务正在进行中';
            return;
          }

          if (event.type === 'finish') {
            if (typeof event.index === 'number' && event.label) {
              steps[event.index] = event.label;
              syncStepLabels();
            }
            finishRun(event.message || '生成完成');
          }
        }
      };
    })();
  </script>

  <script>
    // 初始化
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const videoContainer = document.getElementById('videoContainer');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');
    const stateDisplay = document.getElementById('stateDisplay');
    const directionDisplay = document.getElementById('directionDisplay');
    const triggerCount = document.getElementById('triggerCount');
    const falsePositiveCount = document.getElementById('falsePositiveCount');
    const logSection = document.getElementById('logSection');

    let detector = new HandFaceSwipeDetector()
    const gestureDatasetRecorder = window.AIOperaGestureDatasetRecorder
      ? new window.AIOperaGestureDatasetRecorder()
      : null
    window.aiOperaGestureDatasetRecorder = gestureDatasetRecorder
    const perfMonitor = window.AIOperaPerformanceMonitor
      ? new window.AIOperaPerformanceMonitor()
      : null
    window.aiOperaPerfMonitor = perfMonitor
    let isRunning = false
    let isStartingCamera = false
    let cameraSessionId = 0
    let camera = null
    let faceMesh = null
    let hands = null
    const isLiteMode = window.__legacyMode !== 'full'
    let mediaPipePrewarmPromise = null
    let prewarmedFaceMesh = null
    let prewarmedHands = null

    function createFaceMeshModel() {
      const model = new FaceMesh({
        locateFile: (file) => `/mediapipe/face_mesh/${file}`,
      })
      model.setOptions({
        maxNumFaces: 1,
        refineLandmarks: !isLiteMode,
        minDetectionConfidence: 0.55,
        minTrackingConfidence: 0.6,
      })
      return model
    }

    function createHandsModel() {
      const model = new Hands({
        locateFile: (file) => `/mediapipe/hands/${file}`,
      })
      model.setOptions({
        maxNumHands: isLiteMode ? 1 : 2,
        modelComplexity: 0,
        minDetectionConfidence: isLiteMode ? 0.36 : 0.4,
        minTrackingConfidence: isLiteMode ? 0.36 : 0.42,
      })
      return model
    }

    async function initializeMediaPipeModel(model) {
      if (model && typeof model.initialize === 'function') {
        await model.initialize()
      }
      return model
    }

    function scheduleMediaPipePrewarm() {
      if (mediaPipePrewarmPromise) return mediaPipePrewarmPromise
      mediaPipePrewarmPromise = (async () => {
        prewarmedFaceMesh = createFaceMeshModel()
        prewarmedHands = createHandsModel()
        await Promise.all([
          initializeMediaPipeModel(prewarmedFaceMesh),
          initializeMediaPipeModel(prewarmedHands),
        ])
        return { faceMesh: prewarmedFaceMesh, hands: prewarmedHands }
      })().catch((error) => {
        console.warn('MediaPipe prewarm failed:', error)
        prewarmedFaceMesh = null
        prewarmedHands = null
        mediaPipePrewarmPromise = null
        return null
      })
      return mediaPipePrewarmPromise
    }

    async function takePreparedMediaPipeModels(sessionId) {
      const prepared = await (mediaPipePrewarmPromise || scheduleMediaPipePrewarm())
      const nextFaceMesh = prepared?.faceMesh || createFaceMeshModel()
      const nextHands = prepared?.hands || createHandsModel()
      prewarmedFaceMesh = null
      prewarmedHands = null
      mediaPipePrewarmPromise = null
      nextFaceMesh.onResults((results) => {
        if (cameraSessionId === sessionId && (isRunning || isStartingCamera)) onFaceResults(results)
      })
      nextHands.onResults((results) => {
        if (cameraSessionId === sessionId && (isRunning || isStartingCamera)) onHandsResults(results)
      })
      return { nextFaceMesh, nextHands }
    }

    const runSoon = window.requestIdleCallback || ((callback) => window.setTimeout(callback, 250))
    runSoon(() => scheduleMediaPipePrewarm())

    // 情绪触发状态
    let currentEmotionMaskFile = null
    let lastEmotionSwitchTime = 0
    const EMOTION_SWITCH_COOLDOWN = 1000  // 1秒冷却

    const stateNames = {
      [SwipeState.IDLE]: '待机',
      [SwipeState.ENTERING]: '进入面部',
      [SwipeState.CROSSING]: '横向穿过',
      [SwipeState.EXITING]: '离开触发',
      [SwipeState.TRIGGERED]: '变脸触发！'
    };

    const stateClasses = {
      [SwipeState.IDLE]: 'state-idle',
      [SwipeState.ENTERING]: 'state-entering',
      [SwipeState.CROSSING]: 'state-crossing',
      [SwipeState.EXITING]: 'state-exiting',
      [SwipeState.TRIGGERED]: 'state-triggered'
    };

    const directionNames = {
      [SwipeDirection.NONE]: '-',
      [SwipeDirection.LEFT_TO_RIGHT]: '从左到右',
      [SwipeDirection.RIGHT_TO_LEFT]: '从右到左',
      [SwipeDirection.TOP_TO_BOTTOM]: '从上到下',
      [SwipeDirection.BOTTOM_TO_TOP]: '从下到上'
    }

    function addLog(message, type = 'info') {
      // 日志功能已禁用
    }

    function updateStats(stats) {
      // 统计面板已隐藏，不需要更新
    }

    function triggerFlash() {
      videoContainer.classList.add('trigger-flash');
      setTimeout(() => {
        videoContainer.classList.remove('trigger-flash');
      }, 500);
    }

    // 初始化
    let faceMeshResults = null;
    let handsResults = null;

    async function closeMediaPipeInstance(instance) {
      if (!instance || typeof instance.close !== 'function') return;
      try {
        await instance.close();
      } catch (error) {
        console.warn('MediaPipe close failed:', error);
      }
    }

    async function releaseCameraResources() {
      const oldCamera = camera;
      const oldFaceMesh = faceMesh;
      const oldHands = hands;

      camera = null;
      faceMesh = null;
      hands = null;
      if (oldFaceMesh && oldFaceMesh === prewarmedFaceMesh) prewarmedFaceMesh = null;
      if (oldHands && oldHands === prewarmedHands) prewarmedHands = null;
      if ((oldFaceMesh || oldHands) && !prewarmedFaceMesh && !prewarmedHands) mediaPipePrewarmPromise = null;

      if (oldCamera && typeof oldCamera.stop === 'function') {
        try {
          oldCamera.stop();
        } catch (error) {
          console.warn('Camera stop failed:', error);
        }
      }

      if (video.srcObject && typeof video.srcObject.getTracks === 'function') {
        video.srcObject.getTracks().forEach((track) => track.stop());
        video.srcObject = null;
      }

      await Promise.all([
        closeMediaPipeInstance(oldFaceMesh),
        closeMediaPipeInstance(oldHands),
      ]);
    }

    function resetRuntimeFrameState() {
      faceMeshResults = null;
      handsResults = null;
      currentEmotionMaskFile = null;
      lastEmotionSwitchTime = 0;
      if (typeof detector?.resetGestureTracking === 'function') {
        detector.resetGestureTracking();
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    }

    async function startCamera() {
      if (isRunning || isStartingCamera) return;

      isStartingCamera = true;
      startBtn.disabled = true;
      stopBtn.disabled = true;
      const sessionId = ++cameraSessionId;

      try {
        await releaseCameraResources();
        resetRuntimeFrameState();
        addLog('正在初始化 MediaPipe...');
        
        // 初始化 Face Mesh
        const { nextFaceMesh, nextHands } = await takePreparedMediaPipeModels(sessionId);
        /*
        const nextFaceMesh = new FaceMesh({
          locateFile: (file) => {
            return `/mediapipe/face_mesh/${file}`;
          }
        });
        nextFaceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: !isLiteMode,
          minDetectionConfidence: 0.55,
          minTrackingConfidence: 0.6
        });
        nextFaceMesh.onResults((results) => {
          if (cameraSessionId === sessionId && isRunning) onFaceResults(results);
        });

        // 初始化 Hands
        const nextHands = new Hands({
          locateFile: (file) => {
            return `/mediapipe/hands/${file}`;
          }
        });
        nextHands.setOptions({
          maxNumHands: isLiteMode ? 1 : 2,
          modelComplexity: 0,
          minDetectionConfidence: isLiteMode ? 0.36 : 0.4,
          minTrackingConfidence: isLiteMode ? 0.36 : 0.42
        });
        nextHands.onResults((results) => {
          if (cameraSessionId === sessionId && isRunning) onHandsResults(results);
        });

        */
        faceMesh = nextFaceMesh;
        hands = nextHands;
        let startupFrameCount = 0;
        const FACE_ONLY_STARTUP_FRAMES = 8;

        // 初始化摄像头
        const nextCamera = new Camera(video, {
          onFrame: async () => {
            if (cameraSessionId !== sessionId || (!isRunning && !isStartingCamera)) return;
            const frameToken = perfMonitor?.beginFrame();
            try {
              const shouldRunHands = startupFrameCount >= FACE_ONLY_STARTUP_FRAMES;
              startupFrameCount += 1;
              if (perfMonitor) {
                await perfMonitor.measureAsync('faceMesh', () => nextFaceMesh.send({ image: video }));
                if (shouldRunHands) await perfMonitor.measureAsync('hands', () => nextHands.send({ image: video }));
              } else {
                await nextFaceMesh.send({ image: video });
                if (shouldRunHands) await nextHands.send({ image: video });
              }
            } catch (error) {
              if (cameraSessionId === sessionId && (isRunning || isStartingCamera)) {
                console.warn('MediaPipe frame failed:', error);
              }
            } finally {
              perfMonitor?.endFrame(frameToken);
            }
          },
          width: 640,
          height: 480
        });

        camera = nextCamera;
        await nextCamera.start();

        if (cameraSessionId !== sessionId || camera !== nextCamera) {
          try {
            nextCamera.stop();
          } catch (error) {
            console.warn('Camera stop after stale start failed:', error);
          }
          await Promise.all([
            closeMediaPipeInstance(nextFaceMesh),
            closeMediaPipeInstance(nextHands),
          ]);
          return;
        }
        isRunning = true;
        perfMonitor?.startSession();
        
        startBtn.disabled = true;
        stopBtn.disabled = false;
        addLog('摄像头已启动，请挥手测试！', 'info');
        
        document.getElementById('appContainer').classList.add('is-running');
      } catch (error) {
        addLog(`错误：${error.message}`, 'warn');
        console.error(error);
        if (cameraSessionId === sessionId) {
          isRunning = false;
          await releaseCameraResources();
        }
      } finally {
        if (cameraSessionId === sessionId) {
          isStartingCamera = false;
          startBtn.disabled = isRunning;
          stopBtn.disabled = !isRunning;
        }
      }
    }

    async function stopCamera() {
      cameraSessionId++;
      isRunning = false;
      isStartingCamera = false;
      perfMonitor?.stopSession();
      await releaseCameraResources();
      resetRuntimeFrameState();
      runSoon(() => scheduleMediaPipePrewarm());
      startBtn.disabled = false;
      stopBtn.disabled = true;
      // 隐藏 3D 面罩并重置启动期计时，下次启动重新 warmup，避免黑脸
      if (personalizedRenderer && personalizedRenderer.faceMesh) {
        personalizedRenderer.faceMesh.visible = false;
        if (personalizedRenderer.faceBackMesh) personalizedRenderer.faceBackMesh.visible = false;
        personalizedRenderer._firstLandmarkTime = null;
      }
      addLog('摄像头已停止');
      
      document.getElementById('appContainer').classList.remove('is-running');
    }

    function onFaceResults(results) {
      faceMeshResults = results;

      // 更新3D面具位置
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        updateMaskPosition(results.multiFaceLandmarks[0])
      }
      
      processAndDraw();
    }

    function onHandsResults(results) {
      handsResults = results;
      processAndDraw();
    }

    function processAndDraw() {
      if (!isRunning || !faceMeshResults) return;

      const drawStartedAt = performance.now();
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(faceMeshResults.image, 0, 0, canvas.width, canvas.height);

      // 同步 overlay canvas 尺寸 + 清空
      if (overlayCanvas.width !== canvas.width || overlayCanvas.height !== canvas.height) {
        overlayCanvas.width = canvas.width;
        overlayCanvas.height = canvas.height;
      }
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      let faceLandmarks = null;
      if (faceMeshResults.multiFaceLandmarks && faceMeshResults.multiFaceLandmarks.length > 0) {
        faceLandmarks = faceMeshResults.multiFaceLandmarks[0];
        
        // 【调试元素-已隐藏】绘制面部网格
        // drawConnectors(ctx, faceLandmarks, FACEMESH_TESSELATION, 
        //               { color: '#C0C0C070', lineWidth: 1 });
      }

      // 【调试元素-已隐藏】绘制手部关键点
      // if (handsResults && handsResults.multiHandLandmarks && handsResults.multiHandLandmarks.length > 0) {
      //   for (const handLandmarks of handsResults.multiHandLandmarks) {
      //     drawConnectors(ctx, handLandmarks, HAND_CONNECTIONS,
      //                   { color: '#00FF00', lineWidth: 3 });
      //     drawLandmarks(ctx, handLandmarks,
      //                  { color: '#FF0000', lineWidth: 1, radius: 3 });
      //   }
      // }

      // 更新检测器
      if (isRunning && faceLandmarks) {
        const handLandmarks = pickBestHandForSwipe(faceLandmarks, handsResults);

        const gestureStartedAt = performance.now()
        const state = detector.update(faceLandmarks, handLandmarks, currentYaw || 0, currentPitch || 0)
        gestureDatasetRecorder?.recordFrame({
          faceLandmarks,
          handsResults,
          selectedHand: handLandmarks,
          yaw: currentYaw || 0,
          pitch: currentPitch || 0,
          detector,
        })
        perfMonitor?.recordGestureEvaluation(performance.now() - gestureStartedAt, {
          triggered: detector.triggered,
          triggerType: detector.triggerType,
          direction: detector.direction,
        })
        updateStats(detector.getStats())
        updateLearningProgress()

        if (detector.triggered) {
          triggerFlash()
          addLog(`触发变脸！类型=${detector.triggerType}，方向=${directionNames[detector.direction]}`, 'trigger')
          // 切换面具
          switchFaceMask()
        }

        // 【调试元素-已隐藏】绘制面部区域框
        // const region = detector.detectFaceRegion(faceLandmarks);
        // if (region) {
        //   const w = canvas.width;
        //   const h = canvas.height;
        //   const { xMin, yMin, xMax, yMax } = region.bbox;
        //   ctx.strokeStyle = '#00ff00';
        //   ctx.lineWidth = 2;
        //   ctx.strokeRect(xMin * w, yMin * h, (xMax - xMin) * w, (yMax - yMin) * h);
        // }
      }

      // ===== 喷火系统（粒子在主层即可，因为它本身是发光特效）=====
      if (isRunning && typeof fireBreathUpdate === 'function') {
        fireBreathUpdate(faceLandmarks, handsResults, currentYaw || 0, ctx, canvas.width, canvas.height);
      }

      // ===== 在 overlay 层绘制：手部 mask（让面具被手遮住） + 扇子 =====
      if (isRunning && faceMeshResults && handsResults && handsResults.multiHandLandmarks
          && handsResults.multiHandLandmarks.length > 0
          && typeof drawHandOverlay === 'function') {
        drawHandOverlay(overlayCtx, overlayCanvas.width, overlayCanvas.height, handsResults, faceMeshResults.image);
      }
      if (isRunning && typeof fanUpdate === 'function') {
        // 扇子画到 overlay（在面具之上）
        fanUpdate(faceLandmarks, handsResults, currentYaw || 0, overlayCtx, overlayCanvas.width, overlayCanvas.height);
      }

      ctx.restore();
      perfMonitor?.recordDraw(performance.now() - drawStartedAt);
    }

    function updateLearningProgress() {
      // 学习进度面板已隐藏，不需要更新
    }

    function pickBestHandForSwipe(faceLandmarks, handsRes) {
      if (!faceLandmarks || !handsRes?.multiHandLandmarks?.length) return null;

      const faceCx = (faceLandmarks[234].x + faceLandmarks[454].x) / 2;
      const faceCy = (faceLandmarks[10].y + faceLandmarks[152].y) / 2;
      const faceW = Math.abs(faceLandmarks[454].x - faceLandmarks[234].x);
      const faceH = Math.abs(faceLandmarks[152].y - faceLandmarks[10].y);

      let bestHand = null;
      let bestScore = Number.POSITIVE_INFINITY;

      for (const hand of handsRes.multiHandLandmarks) {
        if (!hand || hand.length < 21) continue;

        const palmIndices = [0, 5, 9, 13, 17];
        const palmPoints = palmIndices.map((index) => hand[index]).filter(Boolean);
        if (palmPoints.length === 0) continue;

        const palmCenter = palmPoints.reduce(
          (acc, point) => {
            acc.x += point.x;
            acc.y += point.y;
            return acc;
          },
          { x: 0, y: 0 },
        );
        palmCenter.x /= palmPoints.length;
        palmCenter.y /= palmPoints.length;

        const swipeAnchor =
          typeof detector !== 'undefined' &&
          detector &&
          typeof detector.getSwipeAnchor === 'function'
            ? detector.getSwipeAnchor(hand) || palmCenter
            : palmCenter;

        const dx = swipeAnchor.x - faceCx;
        const dy = swipeAnchor.y - faceCy;
        const distanceScore = Math.abs(dx) / Math.max(faceW, 0.001) + Math.abs(dy) / Math.max(faceH, 0.001);

        const contactIndices = [0, 5, 9, 13, 17, 4, 8, 12];
        const touchCount = contactIndices.reduce((count, index) => {
          const point = hand[index];
          if (!point) return count;
          const inFaceBox =
            point.x >= faceCx - faceW * 0.8 &&
            point.x <= faceCx + faceW * 0.8 &&
            point.y >= faceCy - faceH * 0.7 &&
            point.y <= faceCy + faceH * 0.7;
          return count + (inFaceBox ? 1 : 0);
        }, 0);

        const openHandBonus =
          typeof detector !== 'undefined' &&
          detector &&
          typeof detector.isOpenHand === 'function' &&
          detector.isOpenHand(hand)
            ? 0.42
            : 0;

        const score = distanceScore - touchCount * 0.22 - openHandBonus;
        if (score < bestScore) {
          bestScore = score;
          bestHand = hand;
        }
      }

      return bestHand;
    }

    // 事件监听
    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    resetBtn.addEventListener('click', () => {
      detector = new HandFaceSwipeDetector();
      perfMonitor?.reset();
      updateStats({
        currentState: SwipeState.IDLE,
        currentDirection: SwipeDirection.NONE,
        totalSwipes: 0,
        falsePositivesFiltered: 0
      });
      addLog('检测器已重置');
    });

    // 初始化
    updateStats({
      currentState: SwipeState.IDLE,
      currentDirection: SwipeDirection.NONE,
      totalSwipes: 0,
      falsePositivesFiltered: 0
    });
  </script>

  <script>

    // 初始化个性化渲染器
    async function initMask3D() {

      personalizedRenderer = new PersonalizedFaceRenderer()

      const success = await personalizedRenderer.init(container, 640, 480)
      
      if (success) {
        addLog('✅ 个性化3D人脸渲染器初始化完成', 'success')
      } else {
        addLog('❌ 个性化渲染器初始化失败', 'error')
      }
    }
    
    // ======================== 脸谱切换（兼容旧接口） ========================
    async function switchFaceMask(specificMaskFile) {
      if (!personalizedRenderer || !personalizedRenderer.isInitialized) {
        addLog('⚠️ 渲染器未初始化', 'warning')
        return
      }
      
      if (specificMaskFile) {
        addLog(`🎭 情绪触发切换: ${specificMaskFile}`, 'trigger')
        const switched = await personalizedRenderer.switchTexture(specificMaskFile)
        if (switched && typeof window.__recordExperiencedMask === 'function') {
          window.__recordExperiencedMask({
            textureKey: specificMaskFile,
            source: 'stage-emotion-switch',
            timestamp: Date.now(),
          })
        }
        if (switched) perfMonitor?.recordMaskSwitch('emotion')
      } else {
        addLog(`🎭 手势触发切换脸谱`, 'trigger')
        const switched = await personalizedRenderer.switchTexture()
        if (switched) {
          const key = personalizedRenderer.faceTextureList?.[personalizedRenderer.currentTextureIndex] || 'guanyu'
          if (typeof window.__recordExperiencedMask === 'function') {
            window.__recordExperiencedMask({
              textureKey: key,
              source: `stage-${detector?.triggerType || 'gesture'}-switch`,
              timestamp: Date.now(),
            })
          }
          perfMonitor?.recordMaskSwitch(detector?.triggerType || 'gesture')
        }
      }
    }

    let maskOcclusionHoldFrames = 0
    const MASK_OCCLUSION_HOLD_FRAMES = 3
    const MASK_OCCLUSION_PALM_INDICES = [0, 5, 9, 13, 17]

    function shouldFreezeMaskForHandOcclusion(faceLandmarks, handsRes) {
      if (!faceLandmarks || !handsRes?.multiHandLandmarks?.length) return false

      const left = Math.min(faceLandmarks[234].x, faceLandmarks[454].x)
      const right = Math.max(faceLandmarks[234].x, faceLandmarks[454].x)
      const top = Math.min(faceLandmarks[10].y, faceLandmarks[152].y)
      const bottom = Math.max(faceLandmarks[10].y, faceLandmarks[152].y)
      const faceWidth = right - left
      const faceHeight = bottom - top

      if (faceWidth <= 0 || faceHeight <= 0) return false

      const innerLeft = left + faceWidth * 0.12
      const innerRight = right - faceWidth * 0.12
      const innerTop = top + faceHeight * 0.08
      const innerBottom = bottom - faceHeight * 0.04

      const inFaceCore = (point) =>
        point &&
        point.x >= innerLeft &&
        point.x <= innerRight &&
        point.y >= innerTop &&
        point.y <= innerBottom

      for (const hand of handsRes.multiHandLandmarks) {
        const palmPoints = MASK_OCCLUSION_PALM_INDICES
          .map((index) => hand[index])
          .filter(Boolean)

        if (palmPoints.length === 0) continue

        const coveredCount = palmPoints.filter(inFaceCore).length
        if (coveredCount >= 2) return true

        const palmCenter = palmPoints.reduce(
          (acc, point) => {
            acc.x += point.x
            acc.y += point.y
            return acc
          },
          { x: 0, y: 0 },
        )
        palmCenter.x /= palmPoints.length
        palmCenter.y /= palmPoints.length

        if (inFaceCore(palmCenter)) return true
      }

      return false
    }
    
    // ======================== 更新面具位置（供onFaceResults调用） ========================
    function updateMaskPosition(landmarks) {
      if (personalizedRenderer && personalizedRenderer.isInitialized) {
        if (shouldFreezeMaskForHandOcclusion(landmarks, handsResults)) {
          maskOcclusionHoldFrames = MASK_OCCLUSION_HOLD_FRAMES
        }

        if (maskOcclusionHoldFrames > 0) {
          maskOcclusionHoldFrames--
          return
        }

        personalizedRenderer.update(landmarks)
        currentYaw = personalizedRenderer.currentYaw
        currentPitch = personalizedRenderer.currentPitch
        if (window.backendMaskClient && typeof window.backendMaskClient.maybeStartPersonalObjBootstrap === 'function') {
          window.backendMaskClient.maybeStartPersonalObjBootstrap()
        }
      }
    }

    // 初始化3D面具
    setTimeout(() => initMask3D(), 500)
  </script>

  <!-- ============== 喷火系统 ============== -->
  <script>
  (function(){
    // ===== 状态机 =====
    const FIRE_IDLE = 0, FIRE_CHARGING = 1, FIRE_FIRING = 2, FIRE_COOLDOWN = 3;
    let fireState = FIRE_IDLE;
    let chargeStart = 0;
    let fireStart = 0;
    let cooldownStart = 0;
    let fireSide = 0; // +1=right(画面右), -1=left
    let fireParticles = [];
    let emberParticles = []; // 火星
    // 手位置（归一化）
    let torchX = 0, torchY = 0;
    // 嘴巴位置（像素）
    let mouthPx = 0, mouthPy = 0;

    const CHARGE_MS = 2000;
    const FIRE_MS = 2500;
    const COOLDOWN_MS = 2000;
    const YAW_THRESHOLD = 0.18;
    // 手相对脸的距离阈值：手腕 x 与脸中心 x 之差，单位为脸宽倍数
    const HAND_DISTANCE_FROM_FACE = 0.55; // 手必须离开脸中心至少 55% 脸宽
    // 手在画面上半部
    const HAND_Y_THRESHOLD = 0.75;

    // ===== 检测：头转向 + 同侧手举起 + 手离脸有一定距离 =====
    function detectFireCondition(faceLandmarks, handsRes, yaw) {
      if (!faceLandmarks || !handsRes || !handsRes.multiHandLandmarks || handsRes.multiHandLandmarks.length === 0) return null;
      if (Math.abs(yaw) < YAW_THRESHOLD) return null;

      // 计算脸中心 + 脸宽（基于 234/454 颊侧关键点）
      const leftCheek = faceLandmarks[234];
      const rightCheek = faceLandmarks[454];
      if (!leftCheek || !rightCheek) return null;
      const faceCx = (leftCheek.x + rightCheek.x) / 2;
      const faceCy = (leftCheek.y + rightCheek.y) / 2;
      const faceW = Math.abs(rightCheek.x - leftCheek.x);
      if (faceW < 0.05) return null; // 脸太小 / 无效

      const headTurnedRight = yaw > 0; // 用户头转向自己的右侧

      for (let i = 0; i < handsRes.multiHandLandmarks.length; i++) {
        const hand = handsRes.multiHandLandmarks[i];
        const wrist = hand[0];
        if (!wrist) continue;

        // 手必须在画面上半部（手举起）
        if (wrist.y > HAND_Y_THRESHOLD) continue;

        // 摄像头是镜像的：用户的右手 → 画面左侧（wrist.x < faceCx）
        // 用户头转右 + 举右手 → 需要 wrist.x < faceCx
        // 用户头转左 + 举左手 → 需要 wrist.x > faceCx
        const handOnScreenRight = wrist.x > faceCx;
        // 用户实际举的是哪只手（与画面侧相反）
        const userRaisedRightHand = !handOnScreenRight;
        const sameSide = (headTurnedRight === userRaisedRightHand);
        if (!sameSide) continue;

        // 手必须远离脸（避免手拂过脸时误触）
        const dx = Math.abs(wrist.x - faceCx);
        if (dx < HAND_DISTANCE_FROM_FACE * faceW) continue;

        // 喷火方向 = 用户头朝向方向（在镜像画面上：头右转 yaw>0 → 喷向画面左侧 side=-1）
        // 因为镜像，用户右侧 = 画面左侧
        return {
          side: headTurnedRight ? -1 : 1,
          wrist: wrist,
          handLandmarks: hand,
          faceCx, faceCy, faceW,
        };
      }
      return null;
    }

    // ===== 火焰粒子 =====
    function spawnFireParticles(cx, cy, side, count) {
      // side: +1 = 火向画面右喷, -1 = 火向画面左喷
      const UP_TILT = Math.PI / 7; // 整体上抬约 25°
      for (let i = 0; i < count; i++) {
        const speed = 6 + Math.random() * 14;
        const baseAngle = side > 0 ? 0 : Math.PI;
        // 减去 side*UP_TILT：side=+1 → 角度变负(右上)，side=-1 → 角度变大(左上)
        const angle = baseAngle - side * UP_TILT + (Math.random() - 0.5) * 0.6;
        fireParticles.push({
          x: cx + (side > 0 ? 8 : -8),
          y: cy + (Math.random() - 0.5) * 6,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed + (Math.random() - 0.5) * 2.5,
          life: 1.0,
          decay: 0.012 + Math.random() * 0.018,
          size: 14 + Math.random() * 22,
          turb: Math.random() * 100,
          spin: (Math.random() - 0.5) * 0.4,
          hue: Math.random() * 0.3, // 0=橙红, 0.3=金黄
        });
      }
      // 随机火星
      if (Math.random() < 0.7) {
        for (let i = 0; i < 3; i++) {
          emberParticles.push({
            x: cx, y: cy,
            vx: (side > 0 ? 1 : -1) * (8 + Math.random() * 12),
            vy: -2 + (Math.random() - 0.5) * 4,
            life: 1.0, decay: 0.02,
            size: 1.5 + Math.random() * 2,
          });
        }
      }
    }

    function updateParticles() {
      for (let i = fireParticles.length - 1; i >= 0; i--) {
        const p = fireParticles[i];
        // 添加湍流扰动
        p.turb += 0.15;
        p.x += p.vx + Math.sin(p.turb) * 1.2;
        p.y += p.vy + Math.cos(p.turb * 0.8) * 0.8;
        p.vy -= 0.25; // 火焰上浮
        p.vx *= 0.985;
        p.life -= p.decay;
        p.size *= 0.992;
        if (p.life <= 0 || p.size < 1) fireParticles.splice(i, 1);
      }
      for (let i = emberParticles.length - 1; i >= 0; i--) {
        const p = emberParticles[i];
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.15; // 重力
        p.life -= p.decay;
        if (p.life <= 0) emberParticles.splice(i, 1);
      }
    }

    function drawParticles(ctx) {
      for (const p of fireParticles) {
        const a = Math.max(0, p.life);
        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 1.4);
        glow.addColorStop(0, `rgba(255,${180 + Math.floor(p.hue * 60)},80,${a * 0.45})`);
        glow.addColorStop(1, 'rgba(255,80,0,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 1.4, 0, Math.PI * 2);
        ctx.fill();
        const core = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        if (a > 0.7) {
          core.addColorStop(0, `rgba(255,255,${200 + Math.floor(a*40)},${a})`);
          core.addColorStop(0.35, `rgba(255,${190 + Math.floor(p.hue*40)},60,${a * 0.95})`);
          core.addColorStop(0.7, `rgba(255,${100 + Math.floor(p.hue*60)},0,${a * 0.7})`);
          core.addColorStop(1, 'rgba(180,30,0,0)');
        } else if (a > 0.4) {
          core.addColorStop(0, `rgba(255,${200 + Math.floor(p.hue*40)},80,${a})`);
          core.addColorStop(0.4, `rgba(255,${100 + Math.floor(p.hue*40)},20,${a * 0.85})`);
          core.addColorStop(1, 'rgba(120,10,0,0)');
        } else {
          core.addColorStop(0, `rgba(220,80,20,${a})`);
          core.addColorStop(0.5, `rgba(150,40,10,${a * 0.7})`);
          core.addColorStop(1, 'rgba(60,10,0,0)');
        }
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      for (const p of emberParticles) {
        const a = Math.max(0, p.life);
        ctx.fillStyle = `rgba(255,${200 + Math.floor(a * 55)},80,${a})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ===== 火把绘制（图片版） =====
    const torchImg = new Image();
    torchImg.src = 'huoba.png';
    
    function drawTorch(ctx, wx, wy, cw, ch) {
      const SCALE = 0.1;       // 火把整体缩放（50%）
      const Y_OFFSET = 15;     // 相对手腕向上偏移（像素）
      const px = wx * cw;       // 手掌中心X坐标
      const py = wy * ch + Y_OFFSET;  // 手掌中心Y坐标（加上偏移）
      const t = performance.now() / 200;
      const flickerX = Math.sin(t * 1.5) * 2;
      const flickerY = Math.sin(t * 2) * 1.5;

      if (!torchImg.complete) return;
      
      ctx.save();
      
      // 计算图片尺寸和位置：图片底部（末端）对准手掌中心
      const imgW = torchImg.width * SCALE;
      const imgH = torchImg.height * SCALE;
      const drawX = px - imgW / 2 + flickerX;  // 水平居中 + 抖动
      const drawY = py - imgH;  // 图片底部对齐手掌中心
      
      ctx.drawImage(torchImg, drawX, drawY, imgW, imgH);
      
      ctx.restore();
    }

    // ===== 主更新函数（每帧从 processAndDraw 调用） =====
    window.fireBreathUpdate = function(faceLandmarks, handsRes, yaw, ctx, cw, ch) {
      const now = performance.now();
      const cond = detectFireCondition(faceLandmarks, handsRes, yaw);

      switch (fireState) {
        case FIRE_IDLE:
          if (cond) {
            fireState = FIRE_CHARGING;
            chargeStart = now;
            // 喷火方向 = 头朝向方向（与 cond.side 一致：用户头转哪边，火喷哪边）
            fireSide = cond.side;
            torchX = cond.wrist.x;
            torchY = cond.wrist.y;
          }
          break;

        case FIRE_CHARGING:
          if (!cond || cond.side !== fireSide) {
            fireState = FIRE_IDLE;
            if (window.personalizedRenderer) personalizedRenderer.setEmissive(0);
            break;
          }
          torchX = cond.wrist.x;
          torchY = cond.wrist.y;

          var progress = Math.min(1, (now - chargeStart) / CHARGE_MS);
          if (window.personalizedRenderer) personalizedRenderer.setEmissive(progress * 1.5);

          drawTorch(ctx, torchX, torchY, cw, ch);

          if (progress >= 1) {
            fireState = FIRE_FIRING;
            fireStart = now;
            if (faceLandmarks) {
              const upper = faceLandmarks[13];
              const lower = faceLandmarks[14];
              mouthPx = ((upper.x + lower.x) / 2) * cw;
              mouthPy = ((upper.y + lower.y) / 2) * ch;
            }
          }
          break;

        case FIRE_FIRING:
          var elapsed = now - fireStart;
          if (elapsed > FIRE_MS) {
            fireState = FIRE_COOLDOWN;
            cooldownStart = now;
            if (window.personalizedRenderer) personalizedRenderer.setEmissive(0);
            break;
          }

          if (window.personalizedRenderer) personalizedRenderer.setEmissive(1.5);

          if (faceLandmarks) {
            const upper = faceLandmarks[13];
            const lower = faceLandmarks[14];
            mouthPx = ((upper.x + lower.x) / 2) * cw;
            mouthPy = ((upper.y + lower.y) / 2) * ch;
          }

          if (cond) { torchX = cond.wrist.x; torchY = cond.wrist.y; }
          drawTorch(ctx, torchX, torchY, cw, ch);

          // 喷火（方向 = 头朝向方向）
          spawnFireParticles(mouthPx, mouthPy, fireSide, 18);
          break;

        case FIRE_COOLDOWN:
          if (now - cooldownStart > COOLDOWN_MS) {
            fireState = FIRE_IDLE;
          }
          break;
      }

      updateParticles();
      if (fireParticles.length > 0 || emberParticles.length > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawParticles(ctx);
        ctx.restore();
      }
    };
  })();
  </script>

  <!-- ============== 手部图层覆盖（手遮住面具） ============== -->
  <script>
  (function(){
    const smoothedHandPolygons = new Map();
    const SMOOTHING = 0.58;

    // 凸包算法（Graham scan 简化版）
    function convexHull(points) {
      const pts = points.slice().sort((a, b) => a.x - b.x || a.y - b.y);
      const n = pts.length;
      if (n < 3) return pts;
      const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
      const lower = [];
      for (const p of pts) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
        lower.push(p);
      }
      const upper = [];
      for (let i = n - 1; i >= 0; i--) {
        const p = pts[i];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
        upper.push(p);
      }
      lower.pop(); upper.pop();
      return lower.concat(upper);
    }

    // 向外扩展凸包（围绕质心放大），让手的轮廓覆盖更充分
    function expandHull(hull, factor = 1.18) {
      if (hull.length === 0) return hull;
      let cx = 0, cy = 0;
      for (const p of hull) { cx += p.x; cy += p.y; }
      cx /= hull.length; cy /= hull.length;
      return hull.map(p => ({
        x: cx + (p.x - cx) * factor,
        y: cy + (p.y - cy) * factor,
      }));
    }

    function resamplePolygon(points, targetCount = 16) {
      if (points.length <= 2) return points;
      const out = [];
      for (let i = 0; i < targetCount; i++) {
        const source = points[Math.floor((i / targetCount) * points.length) % points.length];
        out.push({ x: source.x, y: source.y });
      }
      return out;
    }

    function smoothPolygon(id, polygon) {
      const sampled = resamplePolygon(polygon, 16);
      const prev = smoothedHandPolygons.get(id);
      if (!prev || prev.length !== sampled.length) {
        smoothedHandPolygons.set(id, sampled);
        return sampled;
      }
      const next = sampled.map((point, index) => ({
        x: prev[index].x * SMOOTHING + point.x * (1 - SMOOTHING),
        y: prev[index].y * SMOOTHING + point.y * (1 - SMOOTHING),
      }));
      smoothedHandPolygons.set(id, next);
      return next;
    }

    let handMaskCanvas = null;
    let handSourceCanvas = null;

    function ensureHandOverlayCanvas(cw, ch) {
      if (!handMaskCanvas) handMaskCanvas = document.createElement('canvas');
      if (!handSourceCanvas) handSourceCanvas = document.createElement('canvas');
      if (handMaskCanvas.width !== cw || handMaskCanvas.height !== ch) {
        handMaskCanvas.width = cw;
        handMaskCanvas.height = ch;
        handSourceCanvas.width = cw;
        handSourceCanvas.height = ch;
      }
      return {
        mask: handMaskCanvas,
        source: handSourceCanvas,
        maskCtx: handMaskCanvas.getContext('2d'),
        sourceCtx: handSourceCanvas.getContext('2d'),
      };
    }

    function drawRoundSegment(ctx, a, b, width) {
      if (!a || !b) return;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    function drawHandSilhouetteMask(maskCtx, hand, cw, ch) {
      const pts = hand.map((lm) => ({ x: lm.x * cw, y: lm.y * ch }));
      const palmWidth = Math.max(10, Math.hypot(pts[5].x - pts[17].x, pts[5].y - pts[17].y));
      const fingerWidth = Math.max(13, palmWidth * 0.3);
      const thumbWidth = Math.max(14, palmWidth * 0.34);
      const jointRadius = Math.max(6, palmWidth * 0.13);

      maskCtx.fillStyle = '#000';
      maskCtx.strokeStyle = '#000';

      const palm = [0, 5, 9, 13, 17].map((i) => pts[i]).filter(Boolean);
      if (palm.length >= 3) {
        const hull = expandHull(convexHull(palm), 1.18);
        maskCtx.beginPath();
        maskCtx.moveTo(hull[0].x, hull[0].y);
        for (let i = 1; i < hull.length; i++) maskCtx.lineTo(hull[i].x, hull[i].y);
        maskCtx.closePath();
        maskCtx.fill();
      }

      [
        [0, 1, 2, 3, 4],
        [0, 5, 6, 7, 8],
        [0, 9, 10, 11, 12],
        [0, 13, 14, 15, 16],
        [0, 17, 18, 19, 20],
      ].forEach((chain, chainIndex) => {
        const width = chainIndex === 0 ? thumbWidth : fingerWidth;
        for (let i = 0; i < chain.length - 1; i++) {
          drawRoundSegment(maskCtx, pts[chain[i]], pts[chain[i + 1]], width);
        }
      });

      pts.forEach((point, idx) => {
        if (!point) return;
        const radius = [4, 8, 12, 16, 20].includes(idx) ? jointRadius * 1.18 : jointRadius;
        maskCtx.beginPath();
        maskCtx.arc(point.x, point.y, radius, 0, Math.PI * 2);
        maskCtx.fill();
      });
    }

    window.drawHandOverlay = function(octx, cw, ch, handsRes, videoImage) {
      if (!handsRes.multiHandLandmarks) return;
      const buffers = ensureHandOverlayCanvas(cw, ch);
      const { mask, source, maskCtx, sourceCtx } = buffers;
      maskCtx.clearRect(0, 0, cw, ch);
      sourceCtx.clearRect(0, 0, cw, ch);

      handsRes.multiHandLandmarks.forEach((hand, index) => {
        if (!hand || hand.length < 21) return;
        drawHandSilhouetteMask(maskCtx, hand, cw, ch);
      });

      try {
        sourceCtx.drawImage(videoImage, 0, 0, cw, ch);
        sourceCtx.globalCompositeOperation = 'destination-in';
        sourceCtx.drawImage(mask, 0, 0);
        sourceCtx.globalCompositeOperation = 'source-over';
        octx.drawImage(source, 0, 0);
      } catch (e) {
        sourceCtx.globalCompositeOperation = 'source-over';
      }
    };
  })();
  </script>

  <!-- ============== 扇子遮脸变脸系统 ============== -->
  <script>
  (function(){
    let fanImg = new Image();
    fanImg.src = 'shanzi2.png';
    const FAN_SWITCH_COOLDOWN_FRAMES = 14;
    const FAN_COVER_CONFIRM_FRAMES = 6;
    const FAN_STABLE_CONFIRM_FRAMES = 5;
    const FAN_MAX_MOVE_RATIO = 0.08;
    let fanCooldownFrames = 0;
    let fanCoverFrames = 0;
    let fanStableFrames = 0;
    let lastFanRawFx = null, lastFanRawFy = null;

    function isFist(hand) {
      let curled = 0;
      if (hand[8].y > hand[6].y) curled++;
      if (hand[12].y > hand[10].y) curled++;
      if (hand[16].y > hand[14].y) curled++;
      if (hand[20].y > hand[18].y) curled++;

      const thumbTip = hand[4];
      const indexMcp = hand[5];
      const pinkyMcp = hand[17];
      const thumbClosed = thumbTip && indexMcp && pinkyMcp
        ? Math.hypot(thumbTip.x - indexMcp.x, thumbTip.y - indexMcp.y) <
          Math.hypot(indexMcp.x - pinkyMcp.x, indexMcp.y - pinkyMcp.y) * 0.82
        : true;

      return curled >= 4 && thumbClosed;
    }

    function detectFan(faceLandmarks, handsRes, yaw) {
      if (!faceLandmarks || !handsRes?.multiHandLandmarks?.length) return null;
      if (Math.abs(yaw) > 0.55) return null;
      const faceWidth = Math.abs(faceLandmarks[454].x - faceLandmarks[234].x);
      for (const hand of handsRes.multiHandLandmarks) {
        if (!isFist(hand)) continue;
        return { fist: hand[9], wrist: hand[0], faceWidth };
      }
      return null;
    }

    function fanCoversFace(fx, fy, fw, fh, face, cw, ch) {
      const l = face[234].x * cw, r = face[454].x * cw;
      const t = face[10].y * ch, b = face[152].y * ch;
      const ol = Math.max(fx - fw/2, l), or_ = Math.min(fx + fw/2, r);
      const ot = Math.max(fy - fh, t), ob = Math.min(fy, b);
      if (ol >= or_ || ot >= ob) return false;
      return ((or_ - ol) * (ob - ot)) / ((r - l) * (b - t)) > 0.9;
    }

    // 平滑状态（去抖）
    let smFx = null, smFy = null, smAngle = null;
    const POS_SMOOTH = 0.62;
    const ANGLE_SMOOTH = 0.26;
    let fanLostFrames = 0;
    const FAN_LOST_RESET = 8;

    window.fanUpdate = function(faceLandmarks, handsRes, yaw, ctx, cw, ch) {
      if (fanCooldownFrames > 0) fanCooldownFrames--;

      const cond = detectFan(faceLandmarks, handsRes, yaw);
      if (!cond || !fanImg.complete) {
        fanLostFrames++;
        fanCoverFrames = 0;
        fanStableFrames = 0;
        lastFanRawFx = lastFanRawFy = null;
        if (fanLostFrames > FAN_LOST_RESET) {
          smFx = smFy = smAngle = null;
        }
        return;
      }
      fanLostFrames = 0;

      const fw = Math.max(168, cond.faceWidth * cw * 1.32);
      const fh = fw * (fanImg.height / fanImg.width);
      const rawFx = cond.fist.x * cw, rawFy = cond.fist.y * ch;
      const movePx = lastFanRawFx === null ? 0 : Math.hypot(rawFx - lastFanRawFx, rawFy - lastFanRawFy);
      const moveThreshold = Math.max(16, cond.faceWidth * cw * FAN_MAX_MOVE_RATIO);
      const isStablePose = movePx <= moveThreshold;

      if (isStablePose) {
        fanStableFrames++;
      } else {
        fanStableFrames = 0;
        fanCoverFrames = 0;
      }

      lastFanRawFx = rawFx;
      lastFanRawFy = rawFy;

      // 小臂方向
      const dx = (cond.fist.x - cond.wrist.x) * cw;
      const dy = (cond.fist.y - cond.wrist.y) * ch;
      const rawAngle = Math.atan2(dy, dx) + Math.PI / 2;

      // 平滑（首帧直接采用原始值）
      if (smFx === null) {
        smFx = rawFx; smFy = rawFy; smAngle = rawAngle;
      } else {
        smFx = smFx + (rawFx - smFx) * POS_SMOOTH;
        smFy = smFy + (rawFy - smFy) * POS_SMOOTH;
        // 角度跨 ±π 边界处理：把差值规范到 (-π, π]
        let da = rawAngle - smAngle;
        while (da > Math.PI) da -= 2 * Math.PI;
        while (da < -Math.PI) da += 2 * Math.PI;
        smAngle = smAngle + da * ANGLE_SMOOTH;
      }

      const fx = smFx, fy = smFy, angle = smAngle;

      if (fanStableFrames >= FAN_STABLE_CONFIRM_FRAMES) {
        ctx.save();
        ctx.translate(fx, fy);
        ctx.rotate(angle);
        ctx.drawImage(fanImg, -fw / 2, -fh, fw, fh);
        ctx.restore();
      }

      if (fanStableFrames >= FAN_STABLE_CONFIRM_FRAMES && fanCoversFace(fx, fy, fw, fh, faceLandmarks, cw, ch)) {
        fanCoverFrames++;
      } else {
        fanCoverFrames = 0;
      }

      if (fanCooldownFrames <= 0 && fanCoverFrames >= FAN_COVER_CONFIRM_FRAMES) {
        fanCooldownFrames = FAN_SWITCH_COOLDOWN_FRAMES;
        fanCoverFrames = 0;
        if (typeof switchFaceMask === 'function') switchFaceMask();
        if (typeof detector !== 'undefined' && detector && typeof detector.startCooldown === 'function') {
