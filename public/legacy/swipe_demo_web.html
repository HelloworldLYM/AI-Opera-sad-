  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
  (function(){
    // 内存仓库：key=脸谱文件名, value=snapshot（相同脸谱覆盖，仅保存一张）
    const isFullGalleryMode = window.__legacyMode === 'full';
    const galleryMaxSize = isFullGalleryMode ? 12 : 6;
    const galleryCaptureEnabled = { value: isFullGalleryMode };
    const gallery = new Map();
    const EXPERIENCED_MASKS_STORAGE_KEY = 'aiOperaExperiencedMasks:v1';
    // 每张脸谱卡片的缩略图渲染器（保留引用以便 dispose）
    const thumbCtx = new Map(); // key -> {renderer, scene, camera, mesh, texture}

    const galleryOverlay = document.getElementById('galleryOverlay');
    const galleryGrid = document.getElementById('galleryGrid');
    const galleryHint = document.getElementById('galleryHint');
    const viewerOverlay = document.getElementById('viewerOverlay');
    const viewerContainer = document.getElementById('viewerContainer');
    const viewerTitle = document.getElementById('viewerTitle');
    const spotlightMask = document.getElementById('spotlightMask');

    function isHighQualityItem(item) {
      return !!(item && (item.type === 'hq-glb' || item.glbUrl));
    }

    function getItemTitle(item) {
      if (item?.title) return item.title;
      if (isHighQualityItem(item)) return '个人专属三维脸谱面罩';
      const rawTitle = (item?.textureKey || '脸谱').replace(/\.(png|jpg|jpeg|webp)$/i,'');
      const faceKey = window.resolveFaceKnowledgeKey ? window.resolveFaceKnowledgeKey(rawTitle) : '';
      return window.FaceKnowledgeData?.[faceKey]?.title || rawTitle;
    }

    function getSpotlightTexturePath(item) {
      if (!item) return '';
      if (isHighQualityItem(item)) {
        return item.fallbackSnapshot?.texturePath || '';
      }
      return item.texturePath || '';
    }

    function setSpotlightMaskFromGallery() {
      if (!spotlightMask) return;
      let texturePath = 'faces/关羽.png';
      if (gallery.size > 0) {
        const latest = Array.from(gallery.values()).slice(-1)[0];
        texturePath = getSpotlightTexturePath(latest) || texturePath;
      }
      spotlightMask.src = texturePath;
    }

    function openArcGalleryPage() {
      const href = new URL(`face_gallery_arc.html?mode=${encodeURIComponent(window.__legacyMode || 'lite')}`, window.location.href).href;
      try {
        window.top.location.href = href;
      } catch (error) {
        window.location.href = href;
      }
    }

    function getFaceDataFromKey(textureKey) {
      const faceKey = window.resolveFaceKnowledgeKey ? window.resolveFaceKnowledgeKey(textureKey) : String(textureKey || 'guanyu');
      return {
        faceKey,
        face: window.FaceKnowledgeData?.[faceKey] || null,
      };
    }

    function hasImagePath(value) {
      return /\.(png|jpe?g|webp|gif|avif)(\?|#|$)/i.test(String(value || ''));
    }

    function normalizeFaceTexturePath(value, textureKey) {
      const raw = String(value || '').trim();
      if (raw && hasImagePath(raw)) return raw;
      const { face } = getFaceDataFromKey(raw || textureKey || 'guanyu');
      return face?.image || 'faces/关羽.png';
    }

    function getTexturePathForViewer(textureKey, item) {
      if (item?.texturePath) return normalizeFaceTexturePath(item.texturePath, textureKey);
      if (item?.fallbackSnapshot?.texturePath) return normalizeFaceTexturePath(item.fallbackSnapshot.texturePath, textureKey);
      const { face } = getFaceDataFromKey(textureKey);
      return face?.image || `faces/${textureKey || '关羽'}.png`;
    }

    function getViewerObjUrl(item) {
      const client = window.backendMaskClient;
      const renderer = window.personalizedRenderer || (typeof personalizedRenderer !== 'undefined' ? personalizedRenderer : null);
      let cache = client?.personalObjCache || null;
      if (!cache && typeof client?.loadPersonalObjCache === 'function') {
        try {
          cache = client.loadPersonalObjCache();
        } catch (error) {
          cache = null;
        }
      }
      return item?.objUrl || cache?.objUrl || renderer?.personalObjUrl || '/generated_masks/autodl_user_001/personal_face.obj';
    }

    function readStoredExperiencedFaces() {
      try {
        const raw = window.localStorage?.getItem(EXPERIENCED_MASKS_STORAGE_KEY)
          || window.sessionStorage?.getItem(EXPERIENCED_MASKS_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function writeStoredExperiencedFaces(entries) {
      const normalized = Array.isArray(entries) ? entries.slice(-24) : [];
      const text = JSON.stringify(normalized);
      try {
        window.localStorage?.setItem(EXPERIENCED_MASKS_STORAGE_KEY, text);
      } catch (error) {
        // Local storage may be disabled in privacy mode.
      }
      try {
        window.sessionStorage?.setItem(EXPERIENCED_MASKS_STORAGE_KEY, text);
      } catch (error) {
        // Session storage is only a fallback.
      }
    }

    function normalizeExperiencedFaceEntry(entry) {
      if (!entry) return null;
      const textureKey = getKnowledgeTextureKey(entry);
      const { faceKey, face } = getFaceDataFromKey(textureKey);
      const texturePath = getTexturePathForViewer(textureKey, entry);
      return {
        faceKey,
        faceTitle: entry.faceTitle || entry.title || face?.title || getItemTitle(entry) || '脸谱',
        role: entry.role || face?.role || '',
        objUrl: getViewerObjUrl(entry),
        texturePath,
        source: entry.source || 'stage-used-facepaint',
        manifestUrl: entry.manifestUrl || '',
        normalMapUrl: entry.normalMapUrl || '',
        captureManifest: entry.captureManifest || null,
        assetManifest: entry.assetManifest || null,
        timestamp: Number(entry.timestamp || Date.now()),
      };
    }

    function mergeExperiencedFaceRecords(records) {
      const entries = new Map();
      const addRecord = (entry) => {
        const record = normalizeExperiencedFaceEntry(entry);
        if (!record) return;
        const key = `${record.faceKey}|${record.texturePath}`;
        const existing = entries.get(key);
        entries.set(key, {
          ...(existing || {}),
          ...record,
          timestamp: Math.max(Number(existing?.timestamp || 0), Number(record.timestamp || Date.now())),
        });
      };

      readStoredExperiencedFaces().forEach(addRecord);
      (Array.isArray(records) ? records : [records]).forEach(addRecord);

      const merged = Array.from(entries.values()).sort((a, b) => a.timestamp - b.timestamp);
      writeStoredExperiencedFaces(merged);
      return merged;
    }

    function persistExperiencedFace(item) {
      return mergeExperiencedFaceRecords(item).slice(-1)[0] || null;
    }

    function getExperiencedFacesForViewer(currentItem) {
      const client = window.backendMaskClient;
      const entries = new Map();
      const addEntry = (entry) => {
        if (!entry) return;
        const textureKey = getKnowledgeTextureKey(entry);
        const { faceKey, face } = getFaceDataFromKey(textureKey);
        const texturePath = getTexturePathForViewer(textureKey, entry);
        const key = `${faceKey}|${texturePath}`;
        const existing = entries.get(key);
        entries.set(key, {
          ...(existing || {}),
          faceKey,
          faceTitle: face?.title || getItemTitle(entry) || '脸谱',
          role: face?.role || '',
          objUrl: getViewerObjUrl(entry),
          texturePath,
          source: entry.source || '3ddfa-v3-personal-obj',
          manifestUrl: entry.manifestUrl || '',
          normalMapUrl: entry.normalMapUrl || '',
          captureManifest: entry.captureManifest || null,
          timestamp: Math.max(Number(existing?.timestamp || 0), Number(entry.timestamp || Date.now())),
        });
      };

      readStoredExperiencedFaces().forEach(addEntry);
      gallery.forEach(addEntry);
      addEntry(currentItem);

      if (!entries.size) {
        const textureKey = typeof client?.getTextureKey === 'function' ? client.getTextureKey() : 'guanyu';
        addEntry({ textureKey, source: 'current-runtime-face', timestamp: Date.now() });
      }

      return Array.from(entries.values()).sort((a, b) => a.timestamp - b.timestamp);
    }

    function buildPersonalModelViewerPayload(item) {
      const client = window.backendMaskClient;
      const textureKey = getKnowledgeTextureKey(item || {
        textureKey: typeof client?.getTextureKey === 'function' ? client.getTextureKey() : 'guanyu',
      });
      const { faceKey, face } = getFaceDataFromKey(textureKey);
      return {
        title: '个人专属三维脸谱面罩',
        faceKey,
        faceTitle: face?.title || getItemTitle(item) || '脸谱',
        role: face?.role || '',
        objUrl: getViewerObjUrl(item),
        texturePath: getTexturePathForViewer(textureKey, item),
        experiencedFaces: getExperiencedFacesForViewer(item),
        source: item?.source || '3ddfa-v3-personal-obj',
        manifestUrl: item?.manifestUrl || '',
        normalMapUrl: item?.normalMapUrl || '',
        captureManifest: item?.captureManifest || null,
        mode: window.__legacyMode || 'lite',
        timestamp: Date.now(),
      };
    }

    function persistPersonalModelViewerPayload(item) {
      const payload = buildPersonalModelViewerPayload(item);
      window.__latestPersonalModelViewerPayload = payload;
      mergeExperiencedFaceRecords(payload.experiencedFaces || [payload]);
      try {
        sessionStorage.setItem('personalModelViewerPayload:v1', JSON.stringify(payload));
      } catch (error) {
        // The viewer can still use URL parameters if storage is unavailable.
      }
      return payload;
    }

    async function openPersonalModelViewer(item) {
      const payload = persistPersonalModelViewerPayload(item || window.__latestGalleryModelItem || null);
      try {
        await window.backendMaskClient?.warmPersonalObjCache?.({ objUrl: payload.objUrl }, { refresh: true });
      } catch (error) {
        // The viewer still has its own cache-first loader.
      }
      const href = new URL('/personal_model_viewer.html', window.location.origin);
      href.searchParams.set('face', payload.faceKey || 'guanyu');
      href.searchParams.set('obj', payload.objUrl || '');
      href.searchParams.set('texture', payload.texturePath || '');
      if (payload.manifestUrl) href.searchParams.set('manifest', payload.manifestUrl);
      href.searchParams.set('mode', window.__legacyMode || 'lite');
      try {
        window.top.location.href = href.href;
      } catch (error) {
        window.location.href = href.href;
      }
    }

    window.__recordExperiencedMask = function(recordInput) {
      const renderer = window.personalizedRenderer || (typeof personalizedRenderer !== 'undefined' ? personalizedRenderer : null);
      const list = renderer?.faceTextureList || [];
      const currentKey = list[renderer?.currentTextureIndex || 0] || 'guanyu';
      const base = typeof recordInput === 'string'
        ? { textureKey: recordInput }
        : { ...(recordInput || {}) };
      const textureKey = base.textureKey || currentKey;
      let entry = {
        ...base,
        textureKey,
        source: base.source || 'stage-used-facepaint',
        timestamp: Number(base.timestamp || Date.now()),
      };

      if (renderer?.isInitialized && typeof renderer.captureSnapshot === 'function') {
        try {
          const snap = renderer.captureSnapshot(textureKey, { allowHidden: true });
          if (snap) entry = { ...snap, ...entry, texturePath: snap.texturePath || entry.texturePath };
        } catch (error) {
          // Lightweight face records are enough for the model page fallback.
        }
      }

      persistExperiencedFace(entry);
      window.__latestGalleryModelItem = entry;
      persistPersonalModelViewerPayload(entry);
      return entry;
    };

    window.__openPersonalModelViewer = () => openPersonalModelViewer();

    function getKnowledgeTextureKey(item) {
      const raw = item?.textureKey
        || item?.fallbackSnapshot?.textureKey
        || item?.faceKey
        || item?.texturePath
        || item?.faceTitle
        || getItemTitle(item);
      return window.resolveFaceKnowledgeKey ? window.resolveFaceKnowledgeKey(raw) : String(raw || 'guanyu').replace(/\.(png|jpg|jpeg|webp)$/i, '');
    }

    function openKnowledgePage(item, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const faceKey = getKnowledgeTextureKey(item);
      const title = getItemTitle(item);
      const href = new URL(`face_knowledge.html?face=${encodeURIComponent(faceKey)}&title=${encodeURIComponent(title)}`, window.location.href).href;
      try {
        window.top.location.href = href;
      } catch (error) {
        window.location.href = href;
      }
    }

    function addGalleryItem(item) {
      if (!item) return;
      const key = isHighQualityItem(item)
        ? `hq-glb:${item.textureKey || 'mask'}:${item.timestamp || Date.now()}`
        : (item.textureKey || `snapshot:${item.timestamp || Date.now()}`);
      gallery.set(key, item);
      window.__latestGalleryModelItem = item;
      persistPersonalModelViewerPayload(item);
      const gridStage = document.getElementById('galleryGridStage');
      if (gridStage && gridStage.style.display !== 'none') {
        renderGalleryGrid();
      }
    }

    function disposeMaterial(material) {
      if (!material) return;
      const disposeTexture = (tex) => {
        if (tex && typeof tex.dispose === 'function') tex.dispose();
      };
      const disposeOne = (mat) => {
        [
          'map', 'alphaMap', 'aoMap', 'bumpMap', 'displacementMap',
          'emissiveMap', 'envMap', 'lightMap', 'metalnessMap',
          'normalMap', 'roughnessMap',
        ].forEach((key) => disposeTexture(mat[key]));
        if (typeof mat.dispose === 'function') mat.dispose();
      };
      if (Array.isArray(material)) {
        material.forEach(disposeOne);
      } else {
        disposeOne(material);
      }
    }

    function disposeObject3D(object) {
      if (!object) return;
      object.traverse((child) => {
        if (child.geometry && typeof child.geometry.dispose === 'function') {
          child.geometry.dispose();
        }
        if (child.material) disposeMaterial(child.material);
      });
    }

    function disposeViewerContext(ctx) {
      if (!ctx) return;
      if (ctx.stopFlag) ctx.stopFlag.value = true;
      if (ctx.controls && typeof ctx.controls.dispose === 'function') ctx.controls.dispose();
      if (ctx.scene) disposeObject3D(ctx.scene);
      if (ctx.texture && typeof ctx.texture.dispose === 'function') ctx.texture.dispose();
      if (ctx.renderer) {
        ctx.renderer.dispose();
        if (typeof ctx.renderer.forceContextLoss === 'function') {
          ctx.renderer.forceContextLoss();
        }
      }

        if (!gallery.has(snap.textureKey) && gallery.size >= galleryMaxSize) return;

      // 清掉缩略图避免内存泄漏
      thumbCtx.forEach(c => { if (c.stopFlag) c.stopFlag.value = true; if (c.renderer) c.renderer.dispose(); });
      thumbCtx.clear();
      document.getElementById('galleryGrid').innerHTML = '';
      document.getElementById('galleryGridStage').style.display = 'none';
      document.getElementById('gallerySpotlightStage').style.display = '';

    function openGallery() {
      galleryOverlay.style.display = 'block';
      // 默认进入聚光灯阶段
      document.getElementById('gallerySpotlightStage').style.display = '';
      document.getElementById('galleryGridStage').style.display = 'none';
      setSpotlightMaskFromGallery();
    }
    function closeGallery() {
      galleryOverlay.style.display = 'none';
      // 停止缩略图渲染循环（移除引用，允许 GC；OrbitControls 在详情页单独处理）
      thumbCtx.forEach(ctx => {
        if (ctx.stopFlag) ctx.stopFlag.value = true;
        if (ctx.renderer) { ctx.renderer.dispose(); }
      });
      thumbCtx.clear();
      galleryGrid.innerHTML = '';
      // 复位至聚光灯阶段，下次打开仍是聚光灯先
      document.getElementById('gallerySpotlightStage').style.display = '';
      document.getElementById('galleryGridStage').style.display = 'none';
    }

    function renderGalleryGrid() {
      galleryGrid.innerHTML = '';
      if (gallery.size === 0) {
        galleryHint.style.display = 'block';
        return;
      }

        moreBtn.onmouseleave = () => { moreBtn.style.background = 'linear-gradient(135deg,rgba(110,22,12,0.82),rgba(45,16,6,0.9))'; };

        if (isHq) {

        } else {
          // 渲染该脸谱的 3D 缩略图（静态，不允许旋转）
          renderThumbnail(thumbBox, snap, false);

    function renderHighQualityPlaceholder(container, item) {
      const placeholder = document.createElement('div');
      placeholder.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;background:radial-gradient(circle at 50% 32%,rgba(127,229,255,0.24),transparent 34%),linear-gradient(145deg,#04121f,#11131d 58%,#2d2108);color:#fff3bf;font-family:"KaiTi",serif;letter-spacing:2px;';
      placeholder.innerHTML = '<div><div style="font-size:42px;line-height:1;margin-bottom:14px;color:#8feaff;">◇</div><div style="font-size:18px;font-weight:700;">个人专属三维脸谱面罩</div><div style="margin-top:8px;font-size:12px;color:rgba(255,243,191,0.72);">点击查看三维模型</div></div>';
      container.appendChild(placeholder);
    }

    function createAlignedFacepaintTextureFromImage(image) {
      if (!image || !THREE?.CanvasTexture) return null;
      const size = 1024;
      const fit = { scaleX: 1.16, scaleY: 1.06, offsetX: 0, offsetY: -0.035 };
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      if (!ctx) return null;
      const baseScale = Math.min(size / image.width, size / image.height);
      const width = image.width * baseScale * fit.scaleX;
      const height = image.height * baseScale * fit.scaleY;
      const x = (size - width) * 0.5 + size * fit.offsetX;
      const y = (size - height) * 0.5 + size * fit.offsetY;
      ctx.clearRect(0, 0, size, size);
      ctx.drawImage(image, x, y, width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.flipY = false;
      texture.needsUpdate = true;
      return texture;
    }

    // 创建一个 OBJ 网格组（外凸面贴脸谱，内凹面纯白）
    function buildMeshFromSnapshot(snap, onReady) {
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(snap.positions.slice(), 3));
      geom.setAttribute('uv', new THREE.BufferAttribute(snap.uvs.slice(), 2));
      geom.setIndex(new THREE.BufferAttribute(snap.indices.slice(), 1));
      geom.computeVertexNormals();

      const loader = new THREE.TextureLoader();
      loader.load(snap.texturePath, (tex) => {
        const alignedTex = createAlignedFacepaintTextureFromImage(tex.image);
        if (alignedTex) {
          tex.dispose();
          tex = alignedTex;
        } else {
          tex.flipY = false;
        }

        // 外凸面：贴脸谱
        const matFront = new THREE.MeshStandardMaterial({
          map: tex, transparent: true, alphaTest: 0.1,
          side: THREE.FrontSide, roughness: 0.6, metalness: 0.1,
        });
        const meshFront = new THREE.Mesh(geom, matFront);

        // 内凹面：纯白
        const matBack = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          side: THREE.BackSide,
          roughness: 0.85, metalness: 0.0,
        });
        const meshBack = new THREE.Mesh(geom, matBack);

        const group = new THREE.Group();
        group.add(meshBack);
        group.add(meshFront);
        // 把 boundingBox 和 geometry 暴露在 group 上，便于上层居中逻辑访问
        group.geometry = geom;
        onReady(group, tex);
      }, undefined, (err) => {
        const matFront = new THREE.MeshStandardMaterial({ color: 0xcc8844, side: THREE.FrontSide });
        const matBack = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.BackSide });
        const group = new THREE.Group();
        group.add(new THREE.Mesh(geom, matBack));
        group.add(new THREE.Mesh(geom, matFront));
        group.geometry = geom;
        onReady(group, null);
      });
    }

    function renderThumbnail(container, snap, interactive) {
      const w = container.clientWidth || 200;
      const h = container.clientHeight || 200;
      const scene = new THREE.Scene();
      scene.background = null;
      const camera = new THREE.PerspectiveCamera(35, w/h, 0.01, 10);
      camera.position.set(0, 0, 1.1);
      // 性能优化：交互模式开抗锯齿但限制 pixelRatio；缩略图模式不开抗锯齿
      const renderer = new THREE.WebGLRenderer({ antialias: interactive, alpha: true, powerPreference: 'high-performance' });
      const dpr = Math.min(window.devicePixelRatio || 1, interactive ? 1.5 : 1);
      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h);
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const dl = new THREE.DirectionalLight(0xffffff, 0.7); dl.position.set(1,1,2); scene.add(dl);

      const stopFlag = { value: false };
      const ctx = { renderer, scene, camera, mesh: null, texture: null, stopFlag };
      thumbCtx.set(snap.textureKey + '@' + Math.random(), ctx);

      buildMeshFromSnapshot(snap, (mesh, tex) => {
        // 根据顶点范围自动居中 & 适配
        mesh.geometry.computeBoundingBox();
        const bb = mesh.geometry.boundingBox;
        const cx = (bb.min.x + bb.max.x) / 2;
        const cy = (bb.min.y + bb.max.y) / 2;
        const cz = (bb.min.z + bb.max.z) / 2;
        mesh.position.set(-cx, -cy, -cz);
        const size = Math.max(bb.max.x-bb.min.x, bb.max.y-bb.min.y, bb.max.z-bb.min.z) || 1;
        const dist = size * 1.9;
        camera.position.set(0, 0, dist);
        camera.near = dist/100; camera.far = dist*100; camera.updateProjectionMatrix();

        scene.add(mesh);
        ctx.mesh = mesh; ctx.texture = tex;

        if (interactive) {
          const controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.dampingFactor = 0.08;
          controls.target.set(0,0,0);
          controls.update();
          ctx.controls = controls;

          function animate() {
            if (stopFlag.value) return;
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
          }
          animate();
        } else {
          // 静态缩略图：只渲染一次
          renderer.render(scene, camera);
        }
      });

      return ctx;
    }

    function showHighQualityUnavailable(container, item) {
      container.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;color:#fff3bf;font-family:"KaiTi",serif;background:radial-gradient(circle at center,rgba(127,229,255,0.08),transparent 42%);';
      const box = document.createElement('div');
      box.style.cssText = 'max-width:520px;padding:26px 30px;border:1px solid rgba(127,229,255,0.34);border-radius:16px;background:rgba(5,18,35,0.78);box-shadow:0 20px 70px rgba(0,0,0,0.42);';
      const title = document.createElement('div');
      title.textContent = '三维脸谱面罩暂不可用';
      title.style.cssText = 'font-size:28px;font-weight:800;letter-spacing:4px;color:#fff0b7;margin-bottom:12px;';
      const body = document.createElement('div');
      body.textContent = item && item.fallbackSnapshot ? '可以使用实时三维脸谱快照继续查看。' : '当前暂无可回退的实时三维脸谱快照。';
      body.style.cssText = 'font-size:15px;letter-spacing:1px;color:rgba(255,243,191,0.78);line-height:1.8;';
      box.appendChild(title);
      box.appendChild(body);
      if (item && item.fallbackSnapshot) {
        const fallbackBtn = document.createElement('button');
        fallbackBtn.textContent = '使用实时快照查看';
        fallbackBtn.style.cssText = 'margin-top:18px;background:linear-gradient(135deg,#1a6b95,#d4af37);color:#071626;border:1px solid rgba(255,230,163,0.5);font-weight:800;';
        fallbackBtn.onclick = () => openViewer(item.fallbackSnapshot);
        box.appendChild(fallbackBtn);
      }
      wrap.appendChild(box);
      container.appendChild(wrap);
    }

    function fitObjectToCamera(object, camera, controls) {
      const box = new THREE.Box3().setFromObject(object);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      object.position.sub(center);
      const maxSize = Math.max(size.x, size.y, size.z) || 1;
      const dist = maxSize * 2.2;
      camera.position.set(0, maxSize * 0.08, dist);
      camera.near = dist / 100;
      camera.far = dist * 100;
      camera.updateProjectionMatrix();
      if (controls) {
        controls.target.set(0, 0, 0);
        controls.update();
      }
    }

    function renderHighQualityViewer(container, item) {
      const stopFlag = { value: false };
      const ctx = { renderer: null, scene: null, camera: null, controls: null, stopFlag };
      container.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff3bf;font-family:KaiTi,serif;letter-spacing:4px;">个人专属三维脸谱面罩加载中</div>';

      if (!item || !item.glbUrl || !THREE.GLTFLoader) {
        showHighQualityUnavailable(container, item);
        return ctx;
      }

      const loader = new THREE.GLTFLoader();
      loader.load(item.glbUrl, (gltf) => {
        if (stopFlag.value) {
          disposeObject3D(gltf.scene);
          return;
        }

        const w = container.clientWidth || window.innerWidth || 800;
        const h = container.clientHeight || window.innerHeight || 600;
        const scene = new THREE.Scene();
        scene.background = null;
        const camera = new THREE.PerspectiveCamera(35, w / h, 0.01, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
        renderer.setSize(w, h);
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        const keyLight = new THREE.DirectionalLight(0xffffff, 0.78);
        keyLight.position.set(1.2, 1.4, 2.2);
        scene.add(keyLight);
        const rimLight = new THREE.DirectionalLight(0x8feaff, 0.36);
        rimLight.position.set(-1.5, 0.6, -1.5);
        scene.add(rimLight);

        const model = gltf.scene || gltf.scenes?.[0];
        if (!model) {
          renderer.dispose();
          if (typeof renderer.forceContextLoss === 'function') renderer.forceContextLoss();
          showHighQualityUnavailable(container, item);
          return;
        }

        const group = new THREE.Group();
        group.add(model);
        scene.add(group);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.enableZoom = true;
        controls.enableRotate = true;
        fitObjectToCamera(group, camera, controls);

        ctx.renderer = renderer;
        ctx.scene = scene;
        ctx.camera = camera;
        ctx.controls = controls;
        ctx.mesh = group;

        function animate() {
          if (stopFlag.value) return;
          requestAnimationFrame(animate);
          group.rotation.y += 0.0035;
          controls.update();
          renderer.render(scene, camera);
        }
        animate();
      }, undefined, () => {
        if (!stopFlag.value) showHighQualityUnavailable(container, item);
      });

      return ctx;
    }

    let viewerCtx = null;
    function openViewer(snap) {
      viewerTitle.textContent = '🎭 ' + getItemTitle(snap);
      viewerOverlay.style.display = 'block';
      if (viewerCtx) {
        disposeViewerContext(viewerCtx);
        viewerCtx = null;
      }
      // 暂停 / 释放所有缩略图渲染器，释放 WebGL 上下文给 360 查看器
      thumbCtx.forEach(c => { if (c.stopFlag) c.stopFlag.value = true; if (c.renderer) c.renderer.dispose(); });
      // 等 overlay 显示后测量尺寸
      setTimeout(() => {
        viewerCtx = isHighQualityItem(snap)
          ? renderHighQualityViewer(viewerContainer, snap)
          : renderThumbnail(viewerContainer, snap, true /* 允许360旋转 */);
      }, 500);
    }
    function closeViewer() {
      viewerOverlay.style.display = 'none';
      if (viewerCtx) {
        disposeViewerContext(viewerCtx);
        viewerContainer.innerHTML = '';
        viewerCtx = null;
      }
      // 返回陈列馆时重新渲染缩略图（之前为节省 WebGL 上下文已释放）
      thumbCtx.clear();
      if (document.getElementById('galleryGridStage').style.display !== 'none') {
        renderGalleryGrid();
      }
    }

    window.__addDemoHighQualityMask = function() {
      const fallbackSnapshot = window.__lastHqMaskFallback?.fallbackSnapshot || null;
      const item = {
        type: 'hq-glb',
        title: '个人专属三维脸谱面罩',
        textureKey: 'guanyu',
        glbUrl: '/generated_masks/demo_guanyu_mask.glb',
        fallbackSnapshot,
        source: 'snapshot-obj',
        timestamp: Date.now(),
      };
      addGalleryItem(item);
      return item;
    };

    if (window.BackendMaskClient) {
      window.backendMaskClient = new window.BackendMaskClient({
        personalizedRenderer: () => window.personalizedRenderer || (typeof personalizedRenderer !== 'undefined' ? personalizedRenderer : null),
        getCurrentTextureKey: () => {
          const renderer = window.personalizedRenderer || (typeof personalizedRenderer !== 'undefined' ? personalizedRenderer : null);
          const list = renderer?.faceTextureList || [];
          const key = list[renderer?.currentTextureIndex || 0] || 'guanyu';
          return String(key).replace(/\.(png|jpg|jpeg|webp)$/i, '');
        },
        getCurrentLandmarks: () => {
          try {
            return faceMeshResults?.multiFaceLandmarks?.[0] || null;
          } catch (error) {
            return null;
          }
        },
        addToGallery: addGalleryItem,
        updateStatusPanel: (event) => window.__hqMaskStatusPanel?.update(event),
        log: (message, type) => {
          if (typeof addLog === 'function') addLog(message, type);
        },
      });

      const hiFiMaskBtn = document.getElementById('hiFiMaskBtn');
      if (hiFiMaskBtn) {
        hiFiMaskBtn.addEventListener('click', () => {
          window.backendMaskClient.startDemoGeneration();
        });
      }
    }

    // 暴露以便 personalizedRenderer 初始化后仍能访问
    window.__faceGallery = gallery;
    window.setTimeout(() => {
      const renderer = window.personalizedRenderer || (typeof personalizedRenderer !== 'undefined' ? personalizedRenderer : null);
      const key = renderer?.faceTextureList?.[renderer?.currentTextureIndex || 0] || 'guanyu';
      if (key && typeof window.__recordExperiencedMask === 'function') {
        window.__recordExperiencedMask({
          textureKey: key,
          source: 'stage-initial-facepaint',
          timestamp: Date.now(),
        });
      }
    }, 900);
  })();
  </script>
  <script>
  (function () {
    const panelButton = document.getElementById('gestureDatasetBtn');
    const panel = document.getElementById('gestureDatasetPanel');
    const labelSelect = document.getElementById('gestureDatasetLabel');
    const startButton = document.getElementById('gestureDatasetStartBtn');
    const stopButton = document.getElementById('gestureDatasetStopBtn');
    const exportButton = document.getElementById('gestureDatasetExportBtn');
    const reportButton = document.getElementById('gestureDatasetReportBtn');
    const clearButton = document.getElementById('gestureDatasetClearBtn');
    const status = document.getElementById('gestureDatasetStatus');
    const counts = document.getElementById('gestureDatasetCounts');
    const quality = document.getElementById('gestureDatasetQuality');
    const guide = document.getElementById('gestureDatasetGuide');
    const feedback = document.getElementById('gestureDatasetFeedback');
    const recorder = window.aiOperaGestureDatasetRecorder;
    const labelNames = {
      vertical_swipe: '纵向挥手',
      cover_face: '遮脸',
      head_shake: '左右转头',
      head_nod: '点头',
      raise_hand: '举手',
      idle: '静止',
    };

    function renderGestureGuide(label) {
      if (!guide) return;
      const standards = window.AIOperaGestureDatasetStandards || {};
      const standard = standards[label] || standards.vertical_swipe;
      if (!standard) {
        guide.textContent = '';
        return;
      }
      guide.innerHTML = `<strong>${standard.name}</strong>：${standard.instruction}<span>判定参考：${standard.success}</span>`;
    }

    function renderGestureFeedback(event) {
      if (!feedback) return;
      feedback.classList.remove('is-warning', 'is-success');
      if (!event) {
        feedback.innerHTML = '<strong>采集提示</strong>：打开摄像头后，选择一个标签，点击“开始采集”，完成动作后点击“停止保存”。';
        return;
      }
      if (event.type === 'sample_started') {
        const standard = event.standard || {};
        feedback.innerHTML = `<strong>正在采集 ${standard.name || labelNames[event.label] || event.label}</strong>：${standard.instruction || '按当前标签完成动作。'}`;
        return;
      }
      if (event.type === 'sample_discarded') {
        feedback.classList.add('is-warning');
        feedback.innerHTML = `<strong>这一段没有保存</strong>：只有 ${event.frameCount} 帧，至少需要 ${event.minValidFrames} 帧。动作保持 1-3 秒再停止。`;
        return;
      }
      if (event.type === 'dataset_cleared') {
        feedback.innerHTML = '<strong>本地样本已清空</strong>：可以重新按类别采集。';
        return;
      }
      if (event.type === 'sample_saved') {
        const name = labelNames[event.label] || event.label;
        const quality = event.quality || {};
        const warnings = quality.warnings || [];
        const classDone = event.targetReached ? ` ${name} 已达到 ${event.targetPerLabel} 段。` : '';
        const allDone = event.readyForTraining ? ' 全部类别已达到基础训练条件。' : '';
        feedback.classList.add(warnings.length ? 'is-warning' : 'is-success');
        feedback.innerHTML = `<strong>已保存 1 段 ${name}</strong>：${event.frameCount} 帧，本类 ${event.labelCount}/${event.targetPerLabel} 段。${classDone}${allDone}${warnings.length ? `<span>建议复查：${warnings.slice(0, 3).join('；')}</span>` : '<span>这一段动作质量通过软质检。</span>'}`;
      }
    }

    function renderGestureDatasetState(state) {
      if (!status || !counts || !quality) return;
      const label = state.activeLabel ? ` · ${state.activeLabel}` : '';
      const readyCount = state.readyLabels?.length || 0;
      const target = state.targetPerLabel || 30;
      const labels = window.AIOperaGestureDatasetLabels || ['vertical_swipe', 'cover_face', 'head_shake', 'head_nod', 'raise_hand', 'idle'];
      status.textContent = state.active
        ? `采集中${label} · ${state.activeFrames} 帧`
        : `已保存 ${state.totalSamples} 段样本 · ${readyCount}/${state.labelCount || labels.length} 类达到 ${target} 段`;
      counts.innerHTML = '';
      labels.forEach((item) => {
        const chip = document.createElement('span');
        const count = state.byLabel[item] || 0;
        if (count >= target) chip.classList.add('is-ready');
        chip.textContent = `${labelNames[item] || item}: ${count}/${target}`;
        counts.appendChild(chip);
      });
      quality.innerHTML = '';
      const summary = document.createElement('div');
      const frameAvg = state.frameStats?.avg || 0;
      const readyText = state.readyForTraining ? '已达到基础训练条件' : '还需要补采样本';
      summary.innerHTML = `<strong>${readyText}</strong> · 平均 ${frameAvg} 帧/段 · 最短 ${state.frameStats?.min || 0} 帧 · 最长 ${state.frameStats?.max || 0} 帧`;
      quality.appendChild(summary);
      const warnings = state.qualityWarnings || [];
      if (warnings.length) {
        const list = document.createElement('ul');
        warnings.slice(0, 5).forEach((warning) => {
          const item = document.createElement('li');
          item.textContent = warning;
          list.appendChild(item);
        });
        quality.appendChild(list);
      } else {
        const ok = document.createElement('div');
        ok.textContent = '样本覆盖完整，导出的 JSON 可直接上传 AutoDL 训练。';
        quality.appendChild(ok);
      }
      renderGestureFeedback(state.lastEvent);
    }

    if (panelButton && panel && recorder) {
      recorder.subscribe(renderGestureDatasetState);
      renderGestureGuide(labelSelect?.value || 'vertical_swipe');
      panelButton.addEventListener('click', () => {
        panel.classList.toggle('is-visible');
      });
      labelSelect?.addEventListener('change', () => {
        renderGestureGuide(labelSelect.value || 'vertical_swipe');
      });
      startButton?.addEventListener('click', () => {
        renderGestureGuide(labelSelect?.value || 'vertical_swipe');
        recorder.start(labelSelect?.value || 'idle');
      });
      stopButton?.addEventListener('click', () => {
        recorder.stop();
      });
      exportButton?.addEventListener('click', () => {
        recorder.download();
      });
      reportButton?.addEventListener('click', () => {
        recorder.downloadQualityReport?.();
      });
      clearButton?.addEventListener('click', () => {
        const ok = window.confirm('确定清空本地手势训练样本？');
        if (ok) recorder.clear();
      });
    }
  })();
  </script>

  (function () {
    const toggleBtn = document.getElementById('aiGuideBtn');
    const panel = document.getElementById('aiGuidePanel');

    const stopSpeakBtn = document.getElementById('aiStopSpeakBtn');
    const creativePreview = document.getElementById('aiCreativePreview');
    if (!toggleBtn || !panel || !messagesEl || !input || !sendBtn || !statusEl) return;

    let isBusy = false;
    let hasLoadedConfig = false;
    let lastSpeakableText = '';
    const preferenceStorageKey = 'aiOperaPreferenceEvents:v1';

    function getBackendBaseUrl() {
      const host = window.location.hostname || '127.0.0.1';
      const inferred = `${window.location.protocol}//${host}:8000`;
      return String(window.HQ_MASK_BACKEND_BASE_URL || inferred).replace(/\/+$/, '');
    }

    function getCurrentFaceKey() {
      try {
        if (window.backendMaskClient && typeof window.backendMaskClient.getTextureKey === 'function') {
          return window.backendMaskClient.getTextureKey() || 'guanyu';
        }
        const renderer = window.personalizedRenderer || null;
        const list = renderer?.faceTextureList || [];
        const key = list[renderer?.currentTextureIndex || 0] || 'guanyu';
        return String(key).replace(/\.(png|jpg|jpeg|webp)$/i, '');
      } catch (error) {
        return 'guanyu';
      }
    }

    function loadPreferenceEvents() {
      try {
        const raw = localStorage.getItem(preferenceStorageKey);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed.slice(-120) : [];
      } catch (error) {
        return [];
      }
    }

    function recordPreferenceEvent(type, faceKey, weight = 1) {
      try {
        const events = loadPreferenceEvents();
        events.push({
          type,
          faceKey: window.resolveFaceKnowledgeKey ? window.resolveFaceKnowledgeKey(faceKey || getCurrentFaceKey()) : String(faceKey || getCurrentFaceKey()),
          weight,
          at: new Date().toISOString(),
        });
        localStorage.setItem(preferenceStorageKey, JSON.stringify(events.slice(-120)));
      } catch (error) {
        // Preference memory is optional.
      }
    }

    function getUiContext() {
      const renderer = window.personalizedRenderer || null;
      return {
        page: 'swipe_demo_web',
        currentFaceKey: getCurrentFaceKey(),
        viewedFaceKeys: getViewedFaceKeys(),
        preferenceEvents: loadPreferenceEvents(),
        galleryCount: window.__faceGallery?.size || 0,
        backendGenerationState: window.backendMaskClient?.isGenerating ? 'running' : 'idle',
        personalObjState: window.backendMaskClient?.personalObjState || 'unknown',
        trackingConfidence: renderer?.trackingConfidence || null,
        meshSource: renderer?.meshSource || '',
        gestureDataset: window.aiOperaGestureDatasetRecorder?.getState?.() || null,
      };
    }

    function getViewedFaceKeys() {
      const keys = new Set([getCurrentFaceKey()]);
      try {
        window.__faceGallery?.forEach?.((item) => {
          const raw = item?.textureKey || item?.fallbackSnapshot?.textureKey || item?.faceKey || '';
          if (raw) keys.add(String(raw).replace(/\.(png|jpg|jpeg|webp)$/i, ''));
        });
      } catch (error) {
        // Gallery is optional context only.
      }
      return Array.from(keys).filter(Boolean);
    }

    function getPerformanceContext() {
      try {
        const fps = document.getElementById('perfFps')?.textContent || '';
        const frameMs = document.getElementById('perfFrameMs')?.textContent || '';
        const backendMs = document.getElementById('perfBackendMs')?.textContent || '';
        const backendJobs = document.getElementById('perfBackendJobs')?.textContent || '';
        return { fps, frameMs, backendMs, backendJobs };
      } catch (error) {
        return {};
      }
    }

    function serializeLandmarks(landmarks) {
      if (!landmarks || typeof landmarks[Symbol.iterator] !== 'function') return [];
      return Array.from(landmarks).map((point) => ({
        x: Number(point?.x || 0),
        y: Number(point?.y || 0),
        z: Number(point?.z || 0),
        visibility: Number(point?.visibility || 0),
      }));
    }

    function getFaceLandmarksPayload() {
      try {
        return serializeLandmarks(faceMeshResults?.multiFaceLandmarks?.[0]);
      } catch (error) {
        return [];
      }
    }

    function getHandLandmarksPayload() {
      try {
        return (handsResults?.multiHandLandmarks || []).map((hand) => serializeLandmarks(hand));
      } catch (error) {
        return [];
      }
    }

    function captureCurrentFrameBase64() {
      try {
        const videoEl = document.getElementById('video');
        const sourceCanvas = document.getElementById('canvas');
        const width = videoEl?.videoWidth || sourceCanvas?.width || 640;
        const height = videoEl?.videoHeight || sourceCanvas?.height || 480;
        const scratch = document.createElement('canvas');
        scratch.width = width;
        scratch.height = height;
        const scratchCtx = scratch.getContext('2d');
        if (!scratchCtx) return null;
        if (videoEl && videoEl.readyState >= 2) {
          scratchCtx.drawImage(videoEl, 0, 0, width, height);
        } else if (sourceCanvas) {
          scratchCtx.drawImage(sourceCanvas, 0, 0, width, height);
        } else {
          return null;
        }
        return scratch.toDataURL('image/jpeg', 0.86);
      } catch (error) {
        return null;
      }
    }

    function getTextureFileForFace(face) {
      const key = face?.key || getCurrentFaceKey();
      const localFace = window.FaceKnowledgeData?.[key] || null;
      const image = localFace?.image || face?.image || `faces/${face?.title || key}.png`;
      return String(image).replace(/^\.?\//, '').replace(/^faces\//i, '');
    }

    async function switchToRecommendedFace(face) {
      const renderer = window.personalizedRenderer || null;
      if (!renderer || typeof renderer.switchTexture !== 'function') return false;
      const textureFile = getTextureFileForFace(face);
      const ok = await renderer.switchTexture(textureFile);
      if (ok) {
        recordPreferenceEvent('recommendation_accept', face?.key || textureFile, 1);
        try {
          window.backendMaskClient?.updateCurrentTextureKey?.(face?.key || textureFile);
        } catch (error) {
          // Backend client may not expose a setter; renderer state is enough.
        }
      }
      return !!ok;
    }

    function getGenerationContext() {
      const client = window.backendMaskClient || null;
      return {
        isGenerating: !!client?.isGenerating,
        personalObjState: client?.personalObjState || '',
        reconstructionProfile: client?.reconstructionProfile || '',
        lastCaptureFrames: client?.lastCaptureFrames?.length || 0,
        galleryCount: window.__faceGallery?.size || 0,
      };
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function sanitizeXiaopuText(text) {
      return String(text || '').replace(/[#*]/g, '').trim();
    }

    function addMessage(role, text, meta) {
      const item = document.createElement('div');
      item.className = `ai-guide-message ${role}`;
      const displayText = role === 'user' ? String(text || '') : sanitizeXiaopuText(text);
      item.textContent = displayText;
      if (meta) {
        const metaEl = document.createElement('span');
        metaEl.className = 'ai-guide-meta';
        metaEl.textContent = meta;
        item.appendChild(metaEl);
      }
      messagesEl.appendChild(item);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      if (role === 'agent' || role === 'report') {
        lastSpeakableText = displayText;
      }
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function canSpeak() {
      return typeof window.speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined';
    }

    function speakText(text) {
      const content = String(text || '').replace(/[#*_`>-]/g, '').trim();
      if (!content) return;
      if (!canSpeak()) {
        addMessage('agent', '当前浏览器不支持语音合成，但讲解词已生成，可直接阅读文字。', 'tts-unavailable');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(content);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.92;
      utterance.pitch = 1.02;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }

    async function loadAiConfig() {
      if (hasLoadedConfig) return;
      hasLoadedConfig = true;
      try {
        const response = await fetch(`${getBackendBaseUrl()}/api/ai/config`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const config = await response.json();
        setStatus(config.deepseekConfigured ? `DeepSeek · ${config.model}` : '本地 RAG fallback');
      } catch (error) {
        setStatus('后端未连接');
      }
    }

    async function askAgent(prompt) {
      const message = String(prompt || '').trim();
      if (!message || isBusy) return;
      isBusy = true;
      sendBtn.disabled = true;
      input.value = '';
      addMessage('user', message);
      setStatus('小谱思考中');

      try {
        const response = await fetch(`${getBackendBaseUrl()}/api/ai/agent`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message,
            currentFaceKey: getCurrentFaceKey(),
            uiContext: getUiContext(),
          }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const mode = data.usedDeepSeek ? `DeepSeek · ${data.model || 'model'}` : data.agentMode || 'local-rag';
        setStatus(mode);
        addMessage('agent', data.answer || '小谱暂未返回内容。', mode);
      } catch (error) {
        setStatus('后端未连接');
        addMessage('agent', '小谱后端暂不可用。请确认后端服务已经启动，再回到这里提问。', 'offline');
      } finally {
        isBusy = false;
        sendBtn.disabled = false;
      }
    }

    async function requestRecommendation() {
      if (isBusy) return;
      isBusy = true;
      sendBtn.disabled = true;
      setStatus('智能推荐中');
      try {
        const response = await fetch(`${getBackendBaseUrl()}/api/ai/recommend`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            currentFaceKey: getCurrentFaceKey(),
            viewedFaceKeys: getViewedFaceKeys(),
            preferenceEvents: loadPreferenceEvents(),
            uiContext: getUiContext(),
            limit: 5,
          }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const face = data.face || {};
        const switched = await switchToRecommendedFace(face);
        setStatus(`推荐 · ${data.policy || 'bandit'}`);
        addMessage(
          'agent',
          `${data.reason || '已生成下一张脸谱推荐。'}${switched ? `\n已切换到：${face.title || face.key || '推荐脸谱'}。` : '\n推荐已生成，当前渲染器暂未切换。'}`,
          `score ${data.score ?? '--'}`
        );
      } catch (error) {
        setStatus('后端未连接');
        addMessage('agent', '智能推荐暂不可用。请确认后端已启动。', 'offline');
      } finally {
        isBusy = false;
        sendBtn.disabled = false;
      }
    }

    async function requestGraphContext() {
      if (isBusy) return;
      isBusy = true;
      sendBtn.disabled = true;
      setStatus('GraphRAG 检索中');
      try {
        const faceKey = getCurrentFaceKey();
        const response = await fetch(`${getBackendBaseUrl()}/api/ai/graph?q=${encodeURIComponent(faceKey + ' 脸谱 颜色 寓意 剧目')}&currentFaceKey=${encodeURIComponent(faceKey)}&limit=8`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const labelById = new Map((data.nodes || []).map((node) => [node.id, node.label]));
        const relations = (data.edges || [])
          .slice(0, 6)
          .map((edge) => `${labelById.get(edge.source) || edge.source} --${edge.label || edge.type}--> ${labelById.get(edge.target) || edge.target}`)
          .join('\n');
        setStatus('GraphRAG 子图');
        addMessage(
          'agent',
          `${data.summary || '已生成脸谱关系子图。'}${relations ? `\n${relations}` : ''}`,
          `nodes ${(data.nodes || []).length} · edges ${(data.edges || []).length}`
        );
      } catch (error) {
        setStatus('后端未连接');
        addMessage('agent', '脸谱关系图暂不可用。请确认后端已启动。', 'offline');
      } finally {
        isBusy = false;
        sendBtn.disabled = false;
      }
    }

    async function requestVisualQa() {
      if (isBusy) return;
      isBusy = true;
      sendBtn.disabled = true;
      setStatus('视觉质检中');
      try {
        const response = await fetch(`${getBackendBaseUrl()}/api/ai/visual-qa`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            imageBase64: captureCurrentFrameBase64(),
            currentFaceKey: getCurrentFaceKey(),
            uiContext: getUiContext(),
            faceLandmarks: getFaceLandmarksPayload(),
            handLandmarks: getHandLandmarksPayload(),
            prompt: input.value || '请检查当前面罩贴合、遮挡、清晰度和展示风险。',
          }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const checks = (data.checks || []).map((item) => `${item.name}: ${item.message}`).join('\n');
        setStatus(data.usedExternalVlm ? 'VLM 视觉质检' : '本地视觉质检');
        addMessage('agent', `${data.summary || '视觉质检完成。'}${checks ? `\n${checks}` : ''}`, data.provider || 'visual-qa');
      } catch (error) {
        setStatus('后端未连接');
        addMessage('agent', '视觉质检暂不可用。请确认后端已启动。', 'offline');
      } finally {
        isBusy = false;
        sendBtn.disabled = false;
      }
    }

    async function requestClipSearch() {
      if (isBusy) return;
      isBusy = true;
      sendBtn.disabled = true;
      setStatus('CLIP 检索中');
      const query = input.value.trim() || '从当前画面和体验上下文检索相近脸谱';
      try {
        const response = await fetch(`${getBackendBaseUrl()}/api/ai/clip/search`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query,
            imageBase64: captureCurrentFrameBase64(),
            currentFaceKey: getCurrentFaceKey(),
            limit: 5,
          }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const lines = (data.results || []).map((item, index) => {
          const face = item.face || {};
          return `${index + 1}. ${face.title || face.key} · ${item.reason} · score ${item.score}`;
        }).join('\n');
        setStatus(data.usedExternalClip ? 'CLIP 多模态检索' : 'CLIP-lite 检索');
        addMessage('agent', `检索词：${query}\n${lines || '暂未检索到脸谱。'}`, data.provider || 'clip-search');
      } catch (error) {
        setStatus('后端未连接');
        addMessage('agent', 'CLIP 多模态检索暂不可用。请确认后端已启动。', 'offline');
      } finally {
        isBusy = false;
        sendBtn.disabled = false;
      }
    }

    function renderCreativePreview(data) {
      if (!creativePreview || !data?.editableSvg) return;
      const design = data.design || {};
      const svgBlob = new Blob([data.editableSvg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const palette = (design.palette || [])
        .map((color) => /^#[0-9a-fA-F]{6}$/.test(color) ? color : '#ffffff')
        .map((color) => `<span class="ai-palette-swatch" style="background:${color}"></span>`)
        .join('');
      creativePreview.innerHTML = `
        <img src="${url}" alt="AI 创作脸谱预览">
        <div>
          <h3>${escapeHtml(design.title || 'AI 创作脸谱')}</h3>
          <div class="ai-palette-row">${palette}</div>
          <p>${escapeHtml((design.meaning || []).join('；'))}</p>
          <p>${escapeHtml((design.process || []).join('；'))}</p>
        </div>
      `;
      creativePreview.classList.add('is-visible');
    }

    async function requestCreativeFace() {
      if (isBusy) return;
      isBusy = true;
      sendBtn.disabled = true;
      setStatus('AI 创作中');
      const prompt = input.value.trim() || '结合当前脸谱，创作一个适合沉浸式数字展厅展示的新脸谱设计';
      try {
        const response = await fetch(`${getBackendBaseUrl()}/api/ai/creative-face`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt,
            currentFaceKey: getCurrentFaceKey(),
            style: 'stage-facepaint',
          }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const design = data.design || {};
        renderCreativePreview(data);
        setStatus(data.usedDeepSeek ? 'DeepSeek 创作脸谱' : '本地创作脸谱');
        addMessage(
          'agent',
          `${design.title || 'AI 创作脸谱'}\n${(design.meaning || []).join('\n')}\n\n${data.note || ''}`,
          data.provider || 'creative-face'
        );
      } catch (error) {
        setStatus('后端未连接');
        addMessage('agent', 'AI 创作脸谱暂不可用。请确认后端已启动。', 'offline');
      } finally {
        isBusy = false;
        sendBtn.disabled = false;
      }
    }

    async function requestSamSegment() {
      if (isBusy) return;
      isBusy = true;
      sendBtn.disabled = true;
      setStatus('SAM 遮挡分析中');
      try {
        const response = await fetch(`${getBackendBaseUrl()}/api/ai/sam/segment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            imageBase64: captureCurrentFrameBase64(),
            currentFaceKey: getCurrentFaceKey(),
            uiContext: getUiContext(),
            faceLandmarks: getFaceLandmarksPayload(),
            handLandmarks: getHandLandmarksPayload(),
          }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        setStatus(data.usedExternalSam ? 'SAM 像素分割' : 'SAM fallback 遮挡');
        addMessage(
          'agent',
          `遮挡分割完成：检测到 ${(data.segments || []).length} 个遮挡区域，手脸重叠约 ${Math.round((data.occlusionRatio || 0) * 100)}%。\n${data.note || ''}`,
          data.provider || 'sam-occlusion'
        );
      } catch (error) {
        setStatus('后端未连接');
        addMessage('agent', 'SAM 遮挡分析暂不可用。请确认后端已启动。', 'offline');
      } finally {
        isBusy = false;
        sendBtn.disabled = false;
      }
    }

    async function openDigitalExhibition() {
      addMessage('agent', '脸谱收藏馆已打开。这里会展示已使用过的脸谱、对应唱段和原视频入口。', 'face-gallery');
      window.open('/digital_exhibition_viewer.html?scene=demo-stage', '_blank', 'noopener');
    }

    async function requestNarration() {
      if (isBusy) return;
      isBusy = true;
      sendBtn.disabled = true;
      setStatus('生成讲解词中');
      addMessage('user', '请生成一段适合现场播报的 AI 展馆讲解词。');
      try {
        const response = await fetch(`${getBackendBaseUrl()}/api/ai/narration`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            currentFaceKey: getCurrentFaceKey(),
            uiContext: getUiContext(),
            durationSeconds: 35,
          }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const mode = data.usedDeepSeek ? `DeepSeek · ${data.model || 'model'}` : data.provider || 'local-rag';
        setStatus(`讲解词 · ${mode}`);
        addMessage('agent', data.script || '讲解词暂未生成。', `narration · ${mode}`);
        speakText(data.script || '');
      } catch (error) {
        setStatus('后端未连接');
        addMessage('agent', '讲解词生成失败。请确认后端已启动。', 'offline');
      } finally {
        isBusy = false;
        sendBtn.disabled = false;
      }
    }

    async function requestReport() {
      if (isBusy) return;
      isBusy = true;
      sendBtn.disabled = true;
      setStatus('生成观展报告中');
      addMessage('user', '请根据本次体验生成观展报告。');
      try {
        const response = await fetch(`${getBackendBaseUrl()}/api/ai/report`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            currentFaceKey: getCurrentFaceKey(),
            viewedFaceKeys: getViewedFaceKeys(),
            uiContext: getUiContext(),
            performance: getPerformanceContext(),
            gestureDataset: window.aiOperaGestureDatasetRecorder?.getState?.() || {},
            generation: getGenerationContext(),
          }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const mode = data.usedDeepSeek ? `DeepSeek · ${data.model || 'model'}` : data.provider || 'local-rag';
        setStatus(`观展报告 · ${mode}`);
        addMessage('report', data.report || '观展报告暂未生成。', `report · ${mode}`);
      } catch (error) {
        setStatus('后端未连接');
        addMessage('agent', '观展报告生成失败。请确认后端已启动。', 'offline');
      } finally {
        isBusy = false;
        sendBtn.disabled = false;
      }
    }

    toggleBtn.addEventListener('click', () => {
      panel.classList.toggle('is-visible');
      if (panel.classList.contains('is-visible')) {
        loadAiConfig();
        if (!messagesEl.children.length) {
          addMessage('agent', '我是小谱，你可以问我任何跟川剧相关的问题！', '在线');
        }
        input.focus();
      }
    });

    sendBtn.addEventListener('click', () => askAgent(input.value));
    recommendBtn?.addEventListener('click', () => requestRecommendation());
    graphBtn?.addEventListener('click', () => requestGraphContext());
    visualQaBtn?.addEventListener('click', () => requestVisualQa());
    clipSearchBtn?.addEventListener('click', () => requestClipSearch());
    creativeFaceBtn?.addEventListener('click', () => requestCreativeFace());
    samBtn?.addEventListener('click', () => requestSamSegment());
    narrationBtn?.addEventListener('click', () => requestNarration());
    reportBtn?.addEventListener('click', () => requestReport());
    speakBtn?.addEventListener('click', () => speakText(lastSpeakableText));
    stopSpeakBtn?.addEventListener('click', () => {
      if (canSpeak()) window.speechSynthesis.cancel();
    });
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        askAgent(input.value);
      }
    });
    panel.querySelectorAll('[data-ai-prompt]').forEach((button) => {
      button.addEventListener('click', () => askAgent(button.dataset.aiPrompt || ''));
    });
  })();
  </script>
