<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>脸谱了解更多</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 17px; }
    body {
      min-height: 100vh;
      color: #fff3c2;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      text-rendering: optimizeLegibility;
      background:
        linear-gradient(180deg, rgba(8, 1, 1, 0.68), rgba(14, 3, 3, 0.92)),
        url("gallary_bg.png") center center / cover fixed no-repeat,
        #120303;
    }
    a,
    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid rgba(255, 224, 135, 0.86);
      outline-offset: 4px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 12%, rgba(255, 215, 96, 0.16), transparent 26%),
        radial-gradient(circle at 76% 18%, rgba(205, 34, 51, 0.18), transparent 28%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.36), transparent 45%, rgba(0, 0, 0, 0.38));
      z-index: -1;
    }
    .page {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
    }
    .back-btn {
      min-height: 44px;
      border: 1px solid rgba(212, 175, 55, 0.72);
      background: rgba(70, 16, 8, 0.82);
      color: #ffe38c;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 15px;
      letter-spacing: 2px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
    }
    .back-btn:hover { background: rgba(124, 24, 12, 0.9); }
    .back-btn:active { transform: scale(0.985); }
    .mini-title {
      color: rgba(255, 243, 194, 0.74);
      font-family: "STKaiti", "KaiTi", serif;
      letter-spacing: 6px;
      font-size: 15px;
      text-align: right;
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(260px, 360px) 1fr;
      gap: 34px;
      align-items: center;
      padding: 28px;
      border: 1px solid rgba(212, 175, 55, 0.38);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(15, 4, 4, 0.82), rgba(41, 10, 8, 0.68));
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.36);
    }
    .mask-frame {
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      border: 1px solid rgba(255, 227, 140, 0.3);
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 214, 105, 0.15), transparent 58%),
        rgba(0, 0, 0, 0.5);
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 22px;
    }
    .mask-frame img {
      max-width: 96%;
      max-height: 96%;
      object-fit: contain;
      filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.54));
    }
    .hero-copy h1 {
      font-family: "STXingkai", "华文行楷", "STKaiti", "KaiTi", serif;
      font-size: clamp(52px, 8vw, 92px);
      line-height: 1;
      letter-spacing: 14px;
      color: #f8d45e;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.72), 0 0 26px rgba(255, 200, 68, 0.28);
    }
    .role {
      display: inline-flex;
      margin-top: 18px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 224, 135, 0.42);
      border-radius: 999px;
      color: #fff0b0;
      background: rgba(72, 18, 8, 0.6);
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 18px;
      letter-spacing: 3px;
    }
    .paint-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      min-height: 44px;
      min-width: 158px;
      border: 1px solid rgba(255, 224, 135, 0.64);
      border-radius: 8px;
      padding: 11px 18px;
      color: #3a1600;
      background: linear-gradient(135deg, #ffe38c, #d4af37 58%, #9d5b12);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3), 0 0 18px rgba(255, 211, 96, 0.18);
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 4px;
      text-decoration: none;
    }
    .paint-link:hover {
      filter: brightness(1.08);
    }
    .paint-link:active { transform: scale(0.985); }
    .tagline {
      margin-top: 18px;
      font-family: "STXingkai", "华文行楷", "STKaiti", "KaiTi", serif;
      font-size: clamp(28px, 4.6vw, 48px);
      line-height: 1.18;
      letter-spacing: 6px;
      color: #ffe38c;
      text-shadow:
        0 3px 10px rgba(0, 0, 0, 0.78),
        0 0 18px rgba(255, 206, 86, 0.38),
        0 0 2px rgba(114, 17, 17, 0.95);
    }
    .tagline::first-letter {
      color: #fff4c2;
    }
    .intro {
      margin-top: 22px;
      max-width: 680px;
      color: rgba(255, 245, 210, 0.88);
      font-size: 18px;
      line-height: 1.9;
      font-family: "STKaiti", "KaiTi", serif;
      letter-spacing: 1px;
    }
    .sections {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin-top: 24px;
    }
    .panel {
      min-height: 310px;
      border: 1px solid rgba(212, 175, 55, 0.32);
      border-radius: 8px;
      background: rgba(12, 4, 4, 0.72);
      padding: 26px;
      box-shadow: 0 16px 46px rgba(0, 0, 0, 0.28);
    }
    .panel h2 {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: #ffd970;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 30px;
      letter-spacing: 6px;
    }
    .panel h2::before {
      content: "";
      width: 5px;
      height: 28px;
      border-radius: 2px;
      background: linear-gradient(#ffe7a3, #b11218);
      box-shadow: 0 0 14px rgba(255, 215, 112, 0.46);
    }
    .panel p {
      color: rgba(255, 246, 219, 0.9);
      font-size: 17px;
      line-height: 1.86;
      letter-spacing: 0.5px;
      margin-top: 14px;
      text-wrap: pretty;
    }
    .paint-kit {
      padding: 12px 14px;
      border-left: 3px solid rgba(255, 217, 112, 0.82);
      background: rgba(110, 22, 12, 0.24);
      color: rgba(255, 239, 187, 0.95) !important;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 18px !important;
      line-height: 1.72 !important;
    }
    .process-steps {
      list-style: none;
      margin-top: 18px;
      display: grid;
      gap: 13px;
    }
    .process-steps li {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      align-items: start;
      color: rgba(255, 246, 219, 0.9);
    }
    .process-steps span {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(255, 224, 135, 0.45);
      color: #ffe08a;
      background: rgba(80, 16, 8, 0.62);
      font-family: "Cinzel", "Times New Roman", serif;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 0 16px rgba(255, 199, 84, 0.12);
    }
    .process-steps p {
      margin-top: 1px;
    }
    .sources {
      margin-top: 22px;
      color: rgba(255, 243, 194, 0.58);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }
    .knowledge-assistant {
      margin-top: 22px;
      padding: 20px;
      border: 1px solid rgba(255, 224, 135, 0.28);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(18, 5, 5, 0.82), rgba(48, 12, 8, 0.62));
    }
    .knowledge-assistant h2 {
      margin-bottom: 12px;
      color: #f8d45e;
      font-family: "STKaiti", "KaiTi", serif;
      letter-spacing: 5px;
      font-size: 28px;
    }
    .knowledge-query {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }
    .knowledge-query input {
      min-height: 44px;
      border: 1px solid rgba(255, 224, 135, 0.32);
      border-radius: 8px;
      padding: 0 14px;
      background: rgba(0, 0, 0, 0.28);
      color: #fff3c2;
      font-size: 15px;
    }
    .knowledge-query button {
      min-height: 44px;
      border: 1px solid rgba(212, 175, 55, 0.68);
      border-radius: 8px;
      padding: 0 18px;
      background: rgba(92, 20, 8, 0.9);
      color: #ffe38c;
      cursor: pointer;
      letter-spacing: 2px;
    }
    .knowledge-answer {
      margin-top: 14px;
      color: rgba(255, 246, 219, 0.88);
      line-height: 1.85;
      font-size: 15px;
    }
    .guess-card {
      display: grid;
      grid-template-columns: minmax(140px, 220px) minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
      margin-top: 12px;
    }
    .guess-mask {
      display: grid;
      place-items: center;
      min-height: 220px;
      padding: 16px;
      border: 1px solid rgba(255, 224, 135, 0.22);
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 224, 135, 0.18), transparent 58%),
        rgba(0, 0, 0, 0.32);
    }
    .guess-mask img {
      width: min(160px, 100%);
      max-height: 190px;
      object-fit: contain;
      filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.52));
    }
    .guess-clues {
      display: grid;
      gap: 12px;
    }
    .guess-opera {
      width: fit-content;
      padding: 7px 11px;
      border: 1px solid rgba(255, 224, 135, 0.32);
      border-radius: 999px;
      color: #ffe38c;
      background: rgba(72, 18, 8, 0.48);
      font-family: "STKaiti", "KaiTi", serif;
      letter-spacing: 2px;
    }
    .guess-story {
      color: rgba(255, 246, 219, 0.9);
      font-size: 16px;
      line-height: 1.86;
    }
    .guess-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      margin-top: 2px;
    }
    .guess-form input {
      min-height: 44px;
      border: 1px solid rgba(255, 224, 135, 0.32);
      border-radius: 8px;
      padding: 0 14px;
      background: rgba(0, 0, 0, 0.28);
      color: #fff3c2;
      font-size: 15px;
    }
    .guess-form button {
      min-height: 44px;
      border: 1px solid rgba(212, 175, 55, 0.68);
      border-radius: 8px;
      padding: 0 18px;
      background: rgba(92, 20, 8, 0.9);
      color: #ffe38c;
      cursor: pointer;
      letter-spacing: 2px;
    }
    .guess-form button:last-child {
      color: #3a1600;
      background: linear-gradient(135deg, #ffe38c, #d4af37 58%, #9d5b12);
    }
    .guess-answer {
      min-height: 34px;
      color: rgba(255, 246, 219, 0.88);
      font-size: 15px;
      line-height: 1.7;
    }
    .guess-answer.is-correct {
      color: #b9ffd9;
    }
    .guess-answer.is-wrong {
      color: #ffd5a8;
    }
    .empty {
      padding: 48px 24px;
      text-align: center;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.42);
    }

    @media (max-width: 820px) {
      html { font-size: 16.5px; }
      .page { width: min(100% - 24px, 680px); padding-top: 18px; }
      .topbar { align-items: flex-start; }
      .hero { grid-template-columns: 1fr; padding: 18px; gap: 22px; }
      .mask-frame { max-width: 340px; width: 100%; margin: 0 auto; }
      .hero-copy h1 { font-size: 54px; letter-spacing: 8px; text-align: center; }
      .role { display: flex; justify-content: center; width: fit-content; margin-left: auto; margin-right: auto; }
      .paint-link { display: flex; width: fit-content; margin-left: auto; margin-right: auto; }
      .tagline { text-align: center; font-size: 31px; letter-spacing: 3px; }
      .intro { font-size: 16px; text-align: left; }
      .sections { grid-template-columns: 1fr; }
      .panel { padding: 20px; min-height: auto; }
      .panel h2 { font-size: 26px; letter-spacing: 4px; }
      .knowledge-query { grid-template-columns: 1fr; }
      .guess-card,
      .guess-form { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="/legacy/taste_refinement.css" />
</head>
<body>
  <main class="page">
    <div class="topbar">
      <button class="back-btn" id="backBtn">← 返回陈列馆</button>
      <div class="mini-title">个人脸谱陈列馆 · 了解更多</div>
    </div>
    <section id="content"></section>
  </main>

  <script src="face_knowledge_data.js"></script>
  <script src="culture_knowledge_engine.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const key = window.resolveFaceKnowledgeKey(params.get('face') || params.get('title'));
    const face = window.FaceKnowledgeData[key];
    const content = document.getElementById('content');
    const backBtn = document.getElementById('backBtn');

    window.__xiaopuGetContext = () => ({
      currentFaceKey: key || 'guanyu',
      faceTitle: face?.title || '',
      faceMeta: face?.role || '脸谱知识详情',
      extra: {
        section: 'face_knowledge',
      },
    });

    backBtn.addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'swipe_demo_web.html?mode=lite';
      }
    });

    function renderParagraphs(items) {
      return items.map((text) => `<p>${text}</p>`).join('');
    }

    function renderProcess(face) {
      const steps = face.processSteps || face.process || [];
      const kit = face.paintKit ? `<p class="paint-kit">${face.paintKit}</p>` : '';
      const stepList = steps.map((text, index) => `
        <li>
          <span>${index + 1}</span>
          <p>${text}</p>
        </li>
      `).join('');
      return `${kit}<ol class="process-steps">${stepList}</ol>`;
    }

    if (!face) {
      content.innerHTML = '<div class="empty">暂未找到这个脸谱的资料。</div>';
    } else {
      document.title = `${face.title} · 脸谱了解更多`;
      content.innerHTML = `
        <section class="hero">
          <div class="mask-frame">
            <img src="${face.image}" alt="${face.title}脸谱" />
          </div>
          <div class="hero-copy">
            <h1>${face.title}</h1>
            <div class="role">${face.role}</div>
            <div class="tagline">${face.tagline || `${face.title}——一眼入戏`}</div>
            <a class="paint-link" href="face_painting_play.html?face=${encodeURIComponent(key)}">绘制脸谱</a>
            <p class="intro">${face.story[0]}</p>
          </div>
        </section>
        <section class="sections">
          <article class="panel">
            <h2>人物故事</h2>
            ${renderParagraphs(face.story)}
          </article>
          <article class="panel">
            <h2>脸谱绘制过程</h2>
            ${renderProcess(face)}
          </article>
        </section>
        <section class="knowledge-assistant">
          <h2>川剧猜猜猜</h2>
          <div class="guess-card">
            <div class="guess-mask">
              <img id="guessMask" alt="待猜脸谱" />
            </div>
            <div class="guess-clues">
              <div id="guessOpera" class="guess-opera">经典剧目</div>
              <p id="guessStory" class="guess-story"></p>
              <div class="guess-form">
                <input id="guessInput" type="search" placeholder="输入你猜的角色名，例如：关羽" />
                <button id="guessSubmitBtn" type="button">提交答案</button>
                <button id="guessNextBtn" type="button">下一题</button>
              </div>
              <div id="guessAnswer" class="guess-answer">看脸谱、读故事、看剧目，猜猜这是哪位角色。</div>
            </div>
          </div>
        </section>
        <p class="sources">资料整理自国家京剧院、人民网、央视网及中国京剧戏考等公开戏曲资料，页面文字已按展陈阅读方式改写。</p>
      `;

      const guessFaces = Object.entries(window.FaceKnowledgeData || {})
        .map(([faceKey, item]) => ({ key: faceKey, ...item }))
        .filter((item) => item.title && item.image && item.story?.length);
      const guessMask = document.getElementById('guessMask');
      const guessOpera = document.getElementById('guessOpera');
      const guessStory = document.getElementById('guessStory');
      const guessInput = document.getElementById('guessInput');
      const guessSubmitBtn = document.getElementById('guessSubmitBtn');
      const guessNextBtn = document.getElementById('guessNextBtn');
      const guessAnswer = document.getElementById('guessAnswer');
      let currentGuess = null;

      function normalizeGuess(value) {
        return String(value || '').replace(/\s+/g, '').toLowerCase();
      }

      function operaFromStory(item) {
        const storyText = (item.story || []).join(' ');
        const match = storyText.match(/《([^》]+)》/);
        return match ? `经典剧目：《${match[1]}》` : `经典剧目：${item.role || '川剧传统剧目'}`;
      }

      function maskAnswerInStory(item) {
        let text = item.story?.[0] || '';
        const names = [item.title, ...(item.aliases || [])]
          .filter(Boolean)
          .sort((a, b) => String(b).length - String(a).length);
        names.forEach((name) => {
          const escaped = String(name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          text = text.replace(new RegExp(escaped, 'gi'), '这位角色');
        });
        return text;
      }

      function renderGuessQuestion() {
        if (!guessFaces.length) return;
        const pool = guessFaces.filter((item) => item.key !== currentGuess?.key && item.key !== key);
        currentGuess = pool[Math.floor(Math.random() * pool.length)] || guessFaces[0];
        guessMask.src = currentGuess.image;
        guessMask.alt = '待猜脸谱';
        guessOpera.textContent = operaFromStory(currentGuess);
        guessStory.textContent = maskAnswerInStory(currentGuess);
        guessInput.value = '';
        guessAnswer.className = 'guess-answer';
        guessAnswer.textContent = '看脸谱、读故事、看剧目，猜猜这是哪位角色。';
        guessInput.focus();
      }

      function checkGuess() {
        if (!currentGuess) return;
        const answer = normalizeGuess(guessInput.value);
        if (!answer) {
          guessAnswer.className = 'guess-answer';
          guessAnswer.textContent = '先写下你的答案，再交给小谱判卷。';
          guessInput.focus();
          return;
        }
        const accepted = [currentGuess.title, ...(currentGuess.aliases || [])].map(normalizeGuess);
        if (accepted.includes(answer)) {
          guessAnswer.className = 'guess-answer is-correct';
          guessAnswer.textContent = `猜对了！这就是${currentGuess.title}，眼力很准。`;
        } else {
          guessAnswer.className = 'guess-answer is-wrong';
          guessAnswer.textContent = `差一点。正确答案是：${currentGuess.title}。${currentGuess.role ? `它的脸谱类型是${currentGuess.role}。` : ''}`;
        }
      }

      guessSubmitBtn.addEventListener('click', checkGuess);
      guessNextBtn.addEventListener('click', renderGuessQuestion);
      guessInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') checkGuess();
      });
      renderGuessQuestion();
    }
  </script>
  <script src="/legacy/xiaopu_floating_agent.js?v=20260529-typing-stream"></script>
</body>
</html>
